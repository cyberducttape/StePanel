name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: stepanel-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Keep package and runtime concurrency bounded. The test suite exercises
      # helper subprocesses and SQLite workers; unbounded fan-out can exhaust
      # the runner task budget before the recovery and race gates execute.
      GOMAXPROCS: 2
      GOFLAGS: -p=1
    strategy:
      matrix:
        # Keep CI on the currently released toolchain. Add a newer entry only
        # after setup-go publishes that version for all runner architectures.
        go_version: ['1.26.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go_version }}
          cache: true
      - run: test -z "$(gofmt -l .)"
      - run: make release-check
      - run: go vet ./...
      - run: go test -p 1 -timeout 10m ./... -coverprofile=coverage.out -covermode=atomic
      - name: Enforce coverage floor
        run: bash scripts/check-coverage.sh coverage.out
      - name: Race tests
        env:
          # The race runtime creates additional threads; keep this gate below
          # the hosted runner task budget while retaining all packages.
          GOMAXPROCS: 1
        run: go test -p 1 -race -timeout 10m ./...
      - name: Recovery drills
        run: bash deploy/lab/run-recovery-drills.sh /tmp/stepanel-recovery-drills.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recovery-drill-results
          path: /tmp/stepanel-recovery-drills.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-coverage
          path: coverage.out
      - run: go build -trimpath -o stepanel .
      - name: Production startup smoke test
        run: |
          set -eu
          smoke_root=$(mktemp -d)
          cleanup() { kill "$smoke_pid" 2>/dev/null || true; rm -rf "$smoke_root"; }
          trap cleanup EXIT
          STEPANEL_ENV=production \
          STEPANEL_LISTEN=127.0.0.1:18090 \
          STEPANEL_TLS_TERMINATED=0 \
          STEPANEL_ADMIN_PASSWORD=ci-only-password \
          STEPANEL_ADMIN_TOTP_SECRET=JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP \
          STEPANEL_ACCOUNT_KEY=ci-account-key-012345678901234567890123456789 \
          STEPANEL_SESSION_SECRET=ci-session-secret-012345678901234567890123 \
          STEPANEL_AUDIT_KEY=ci-audit-key-012345678901234567890123456789 \
          STEPANEL_ENVIRONMENT_KEY=ci-environment-key-012345678901234567890123456789 \
          STEPANEL_BACKUP_SIGNING_KEY=ci-backup-signing-key-012345678901234567890123456789 \
          STEPANEL_OFFSITE_TARGET=s3:stepanel-ci \
          STEPANEL_REQUIRE_OFFSITE_BACKUP=1 \
          STEPANEL_IMPORT_ROOT="$smoke_root/imports" \
          STEPANEL_BACKUP_ROOT="$smoke_root/backups" \
          STEPANEL_WEB_ROOT="$smoke_root/www" \
          STEPANEL_MAIL_ROOT="$smoke_root/mail" \
          STEPANEL_NVM_DIR="$smoke_root/nvm" \
          STEPANEL_PROXY_ROOT="$smoke_root/proxy" \
          STEPANEL_VHOST_ROOT="$smoke_root/vhosts" \
          STEPANEL_APP_ROOT="$smoke_root/apps" \
          STEPANEL_MALWARE_ROOT="$smoke_root/quarantine" \
          STEPANEL_AUDIT_LOG="$smoke_root/audit.jsonl" \
          STEPANEL_JOB_STATE="$smoke_root/jobs.json" \
          STEPANEL_SESSION_STATE="$smoke_root/sessions.json" \
          STEPANEL_CONTROL_PLANE_DB="$smoke_root/control-plane.db" \
          STEPANEL_RECOVERY_ROOT="$smoke_root/recovery" \
          ./stepanel >"$smoke_root/service.log" 2>&1 &
          smoke_pid=$!
          ready=0
          for _ in $(seq 1 20); do
            if curl --fail --silent --max-time 1 http://127.0.0.1:18090/livez >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
      - run: bash -n install.sh
      - run: bash -n scripts/check-release.sh
      - run: bash -n deploy/integrations/install-fail2ban.sh
      - run: bash -n deploy/lab/install-smoke.sh
      - run: bash -n deploy/integrations/*
      - name: Lint shell scripts
        run: shellcheck -S warning install.sh deploy/lab/run.sh deploy/integrations/*
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Build container
        run: docker build --tag stepanel:ci .
      - name: Production container smoke test
        run: |
          set -eu
          cleanup() { docker rm -f stepanel-container-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name stepanel-container-smoke -p 18091:8080 \
            -e STEPANEL_TLS_TERMINATED=1 \
            -e STEPANEL_ADMIN_PASSWORD=ci-only-password \
            -e STEPANEL_ADMIN_TOTP_SECRET=JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP \
            -e STEPANEL_ACCOUNT_KEY=ci-account-key-012345678901234567890123456789 \
            -e STEPANEL_SESSION_SECRET=ci-session-secret-012345678901234567890123 \
            -e STEPANEL_AUDIT_KEY=ci-audit-key-012345678901234567890123456789 \
            -e STEPANEL_ENVIRONMENT_KEY=ci-environment-key-012345678901234567890123456789 \
            -e STEPANEL_BACKUP_SIGNING_KEY=ci-backup-signing-key-012345678901234567890123456789 \
            -e STEPANEL_OFFSITE_TARGET=local:/tmp/stepanel-offsite \
            -e STEPANEL_REQUIRE_OFFSITE_BACKUP=1 \
            stepanel:ci
          ready=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --max-time 1 http://127.0.0.1:18091/livez >/dev/null && \
               curl --fail --silent --max-time 1 http://127.0.0.1:18091/readyz >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.4
      - name: Lint Helm chart
        run: helm lint deploy/helm/stepanel
      - name: Render Helm chart
        run: helm template stepanel deploy/helm/stepanel >/tmp/stepanel-rendered.yaml && test -s /tmp/stepanel-rendered.yaml
      - name: Validate Kubernetes manifests
        run: docker run --rm -v "$PWD:/work:ro" -v /tmp:/tmp:ro ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary /work/deploy/kubernetes/stepanel.yaml /tmp/stepanel-rendered.yaml
      - name: Enforce immutable deployment references
        run: |
          ! rg -n --glob '!**/.terraform/**' 'stepanel:(latest|v[0-9])' deploy Dockerfile
          grep -Eq 'stepanel@sha256:[a-f0-9]{64}' deploy/kubernetes/stepanel.yaml
          grep -Eq 'stepanel@sha256:[a-f0-9]{64}' deploy/terraform/variables.tf
          grep -Eq 'digest: sha256:[a-f0-9]{64}' deploy/helm/stepanel/values.yaml
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
      - name: Validate Terraform
        working-directory: deploy/terraform
        run: terraform fmt -check -recursive && terraform init -backend=false && terraform validate
      - name: Scan container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: stepanel:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
