name: CI

on:
  pull_request:

concurrency:
  group: stepanel-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOMAXPROCS: 2
      GOFLAGS: -p=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
      - name: Go formatting
        run: test -z "$(gofmt -l .)"
      - name: Release tree contract
        run: make release-check
      - name: Go vet
        run: go vet ./...
      - name: Go unit and package security tests
        run: go test -p 1 -timeout 10m ./...
      - name: Frontend unit tests
        run: |
          npm ci --no-audit --no-fund
          npm run test:unit
      - name: Shell syntax checks
        run: bash -n install.sh deploy/lib/*.sh deploy/integrations/*
