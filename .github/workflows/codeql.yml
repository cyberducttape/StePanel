name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: stepanel-codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@e675ced7a364adc01df007f132e3ce2d798d37f9 # v4
        with:
          languages: go
      - uses: actions/setup-go@3041bf56c941b39c61721b86cd82f6f55fc0cf6e # v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Build
        run: go build -trimpath ./...
      - name: Analyze
        uses: github/codeql-action/analyze@e675ced7a364adc01df007f132e3ce2d798d37f9 # v4
