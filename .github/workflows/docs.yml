name: Documentation

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'scripts/check-docs-links.sh'
      - 'scripts/check-docs-references.py'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/check-docs-links.sh'
      - 'scripts/check-docs-references.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check documentation links
        run: bash scripts/check-docs-links.sh docs
      - name: Check documentation source references
        run: python3 scripts/check-docs-references.py
      # CI integration ignores Markdown-only pushes, so the Go tests that
      # hold the documentation to the code's contract run here as well.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
      - name: Run documentation contract tests
        run: |
          tests=$(grep -ho '^func Test[A-Za-z0-9_]*' install_docs_test.go release_scope_docs_test.go openapi_contract_test.go | sed 's/^func //' | paste -sd'|')
          go test -count=1 -run "^(${tests}|TestInstallerJournalsBeforeMutationAndRecordsPartialRollbackContract)$" .
          go test -count=1 -run '^TestGateOneDocumentMatchesManager$' ./internal/sites/
