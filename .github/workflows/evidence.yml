name: Release evidence

# Publishes a downloadable report for one exact source commit, including
# content-equivalent workflow runs and the reviewed P0 table from that commit.
on:
  workflow_run:
    workflows:
      - CI integration
      - CodeQL
      - Documentation
      - Installation smoke
      - Installed recovery cohort
      - Quota-enabled production install smoke
      - N-1 upgrade smoke
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Commit to report on (defaults to the head of main)
        required: false
        type: string
        default: ''

# Only the newest report matters; a later run supersedes an earlier one.
concurrency:
  group: stepanel-release-evidence
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The default branch, never the triggering run's code: workflow_run
      # executes with repository permissions.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          # Commits of deleted pull-request branches are fetched by SHA;
          # the repository is public, so no credentials are kept.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
      - name: Generate release evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT: ${{ inputs.commit || github.event.workflow_run.head_sha || github.sha }}
        id: report
        run: |
          [[ $COMMIT =~ ^[0-9a-f]{40}$ ]] || { echo "expected a full commit SHA, got: $COMMIT" >&2; exit 1; }
          git fetch --quiet --no-tags origin "$COMMIT"
          commit=$(git rev-parse --verify --end-of-options "$COMMIT^{commit}")
          go run ./cmd/stepanel-evidence --commit "$commit" > release-evidence.md
          grep -Fq "Source commit: [\`$commit\`]" release-evidence.md || { echo 'report source identity does not match requested commit' >&2; exit 1; }
          cat release-evidence.md >> "$GITHUB_STEP_SUMMARY"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Upload exact-source release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence-${{ steps.report.outputs.commit }}
          path: release-evidence.md
          if-no-files-found: error
          retention-days: 90
