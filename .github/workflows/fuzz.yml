name: Security fuzzing

on:
  schedule:
    - cron: '43 4 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOMAXPROCS: 2
      GOFLAGS: -p=1
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: actions/setup-go@v5 # v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Fuzz privileged-input and archive validators
        run: go test -run=^$ -fuzz=Fuzz -fuzztime=5m .
