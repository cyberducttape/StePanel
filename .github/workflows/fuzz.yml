name: Security fuzzing

on:
  schedule:
    - cron: '43 4 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOMAXPROCS: 2
      GOFLAGS: -p=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.x'
          cache: true
      - name: Fuzz privileged-input and archive validators
        run: |
          for target in FuzzSafeArchivePath FuzzSafeUser FuzzValidBackupName FuzzManagedDatabaseIdentifier; do
            go test -run=^$ -fuzz="^${target}$" -fuzztime=75s .
          done
