name: Security fuzzing

on:
  schedule:
    - cron: '43 4 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOMAXPROCS: 2
      GOFLAGS: -p=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: true
      - name: Fuzz privileged-input and archive validators
        run: |
          for target in FuzzSafeArchivePath FuzzSafeUser FuzzValidBackupName FuzzManagedDatabaseIdentifier; do
            go test -run=^$ -fuzz="^${target}$" -fuzztime=75s .
          done
