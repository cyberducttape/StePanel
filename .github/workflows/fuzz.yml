name: Security fuzzing

on:
  schedule:
    - cron: '43 4 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOMAXPROCS: 2
      GOFLAGS: -p=1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-go@3041bf56c941b39c61721b86cd82f6f55fc0cf6e # v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Fuzz privileged-input and archive validators
        run: go test -run=^$ -fuzz=Fuzz -fuzztime=5m .
