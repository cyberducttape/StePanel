name: Installation smoke

on:
  workflow_call:
    inputs:
      full_recovery_matrix:
        description: Run every supported recovery boundary
        required: false
        type: boolean
        default: false
      recovery_matrix_repeats:
        description: One exhaustive recovery iteration per shard
        required: false
        type: number
        default: 1
      recovery_matrix_shard:
        description: Unique identifier for this exhaustive recovery shard
        required: false
        type: string
        default: ''
      identity_repair_smoke:
        description: Exercise legacy site identity collision repair on the installed disposable host
        required: false
        type: boolean
        default: false
      host:
        description: Installed-host combination, or all
        required: false
        type: string
        default: all
  schedule:
    - cron: '17 3 * * *'
  # Changes to the privileged side or the installed-host drills run one host
  # right away instead of waiting for the nightly six-host run: unit tests
  # cannot see real ownership, quotas, mounts or systemd sandboxing.
  push:
    branches: [main]
    paths:
      - 'deploy/integrations/**'
      - 'deploy/lib/**'
      - 'deploy/lab/**'
      - 'install.sh'
      - 'auth.go'
      - 'config.go'
      - 'main.go'
      - 'backup_restore.go'
      - 'recovery.go'
      - 'recovery_proof_wordpress.go'
      - 'database_operations.go'
      - 'internal/importer/**'
      - 'internal/sites/**'
      - 'internal/rootbroker/**'
      - 'cmd/stepanel-root/**'
      - '.github/workflows/install-smoke.yml'
  workflow_dispatch:
    inputs:
      full_recovery_matrix:
        description: 'Run every supported recovery boundary'
        required: false
        default: false
        type: boolean
      recovery_matrix_repeats:
        description: 'Run one exhaustive recovery iteration per shard; use unique shard IDs for repeated certification'
        required: false
        default: 1
        type: number
      recovery_matrix_shard:
        description: 'Unique identifier (required for each full recovery shard)'
        required: false
        default: ''
        type: string
      identity_repair_smoke:
        description: 'Exercise legacy site identity collision repair on the installed disposable host'
        required: false
        default: false
        type: boolean
      host:
        description: 'Limit this diagnostic run to one installed-host combination'
        required: false
        default: all
        type: choice
        options:
          - all
          - ubuntu-24.04-caddy-mariadb
          - ubuntu-24.04-apache-mariadb
          - almalinux-9-apache-mariadb
          - almalinux-9-caddy-mariadb
          - rocky-9-apache-mariadb
          - rocky-9-caddy-mariadb

concurrency:
  # Preserve long-running scheduled and release-candidate evidence. Repeated
  # recovery shards must have independent groups so GitHub does not replace
  # all but the latest pending shard for the same workflow event.
  group: stepanel-install-smoke-${{ github.ref }}-${{ github.event_name }}-${{ inputs.recovery_matrix_shard || 'default' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  select-hosts:
    runs-on: ubuntu-24.04
    outputs:
      hosts: ${{ steps.select.outputs.hosts }}
    steps:
      - id: select
        env:
          REQUESTED_HOST: ${{ inputs.host || (github.event_name == 'push' && 'almalinux-9-caddy-mariadb') || 'all' }}
        run: |
          case "$REQUESTED_HOST" in
            all)
              hosts='[{"name":"ubuntu-24.04-caddy-mariadb","image":"ubuntu:24.04","db":"mariadb","web":"caddy"},{"name":"ubuntu-24.04-apache-mariadb","image":"ubuntu:24.04","db":"mariadb","web":"apache"},{"name":"almalinux-9-apache-mariadb","image":"almalinux:9","db":"mariadb","web":"apache"},{"name":"almalinux-9-caddy-mariadb","image":"almalinux:9","db":"mariadb","web":"caddy"},{"name":"rocky-9-apache-mariadb","image":"rockylinux:9","db":"mariadb","web":"apache"},{"name":"rocky-9-caddy-mariadb","image":"rockylinux:9","db":"mariadb","web":"caddy"}]'
              ;;
            ubuntu-24.04-caddy-mariadb)
              hosts='[{"name":"ubuntu-24.04-caddy-mariadb","image":"ubuntu:24.04","db":"mariadb","web":"caddy"}]'
              ;;
            ubuntu-24.04-apache-mariadb)
              hosts='[{"name":"ubuntu-24.04-apache-mariadb","image":"ubuntu:24.04","db":"mariadb","web":"apache"}]'
              ;;
            almalinux-9-apache-mariadb)
              hosts='[{"name":"almalinux-9-apache-mariadb","image":"almalinux:9","db":"mariadb","web":"apache"}]'
              ;;
            almalinux-9-caddy-mariadb)
              hosts='[{"name":"almalinux-9-caddy-mariadb","image":"almalinux:9","db":"mariadb","web":"caddy"}]'
              ;;
            rocky-9-apache-mariadb)
              hosts='[{"name":"rocky-9-apache-mariadb","image":"rockylinux:9","db":"mariadb","web":"apache"}]'
              ;;
            rocky-9-caddy-mariadb)
              hosts='[{"name":"rocky-9-caddy-mariadb","image":"rockylinux:9","db":"mariadb","web":"caddy"}]'
              ;;
            *) echo "unsupported host selection: $REQUESTED_HOST" >&2; exit 64 ;;
          esac
          printf 'hosts=%s\n' "$hosts" >> "$GITHUB_OUTPUT"

  install:
    needs: select-hosts
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.full_recovery_matrix && 360 || 150 }}
    env:
      RECOVERY_MATRIX_REPEATS: ${{ inputs.recovery_matrix_repeats || 1 }}
      RECOVERY_MATRIX_SHARD: ${{ inputs.recovery_matrix_shard || '' }}
      FULL_RECOVERY_MATRIX: ${{ inputs.full_recovery_matrix || false }}
      RUN_IDENTITY_REPAIR_SMOKE: ${{ inputs.identity_repair_smoke || (github.event_name == 'push') }}
    strategy:
      fail-fast: false
      # The six supported OS/web-server combinations are the largest matrix
      # in one run. Repetition happens across uniquely identified workflows,
      # each with one exhaustive iteration, so no job can exceed six hours.
      max-parallel: 6
      matrix:
        include: ${{ fromJSON(needs.select-hosts.outputs.hosts) }}
    name: ${{ matrix.name }} / shard ${{ inputs.recovery_matrix_shard || 'default' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
      - name: Validate recovery matrix repeat count
        run: bash scripts/validate-recovery-matrix-inputs.sh
      - name: Build release-shaped installer tree
        run: |
          go build -trimpath -ldflags='-s -w' -o stepanel ./cmd/stepanel
          go build -trimpath -ldflags='-s -w' -o stepanel-root ./cmd/stepanel-root
      - name: Build disposable systemd host image
        timeout-minutes: 20
        env:
          IMAGE: ${{ matrix.image }}
          HOST_IMAGE: stepanel-systemd-host:${{ matrix.name }}
        run: docker build --build-arg BASE_IMAGE="$IMAGE" -f deploy/lab/Dockerfile.systemd -t "$HOST_IMAGE" .
      - name: Start disposable systemd host
        timeout-minutes: 12
        env:
          HOST_IMAGE: stepanel-systemd-host:${{ matrix.name }}
        run: |
          set -eu
          docker_bounded() {
            local deadline=$1
            shift
            timeout --foreground --kill-after=2s "$deadline" docker "$@"
          }
          docker_diag() { docker_bounded 10s "$@"; }
          cleanup() { timeout --foreground --kill-after=2s 15s docker rm -f stepanel-install >/dev/null 2>&1 || true; }
          trap 'status=$?; if (( status != 0 )); then cleanup; fi' EXIT
          if ! docker_bounded 15s info >/dev/null 2>&1; then
            echo 'Docker is unavailable or unresponsive on this runner' >&2
            docker_bounded 15s info >&2 || true
            docker_diag ps -a >&2 || true
            exit 77
          fi
          if [[ ! -f /sys/fs/cgroup/cgroup.controllers && ! -d /sys/fs/cgroup/systemd ]]; then
            echo 'Runner does not provide a systemd-compatible cgroup hierarchy' >&2
            exit 77
          fi
          if ! docker_bounded 30s run -d --privileged --name stepanel-install \
              --security-opt=no-new-privileges:false \
              --security-opt=apparmor=unconfined \
              --userns=host \
              --cgroupns=host \
              --tmpfs /run --tmpfs /run/lock \
              -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
              -v "$PWD:/work" "$HOST_IMAGE" /sbin/init; then
            echo 'Docker did not create the disposable systemd host within 30 seconds' >&2
            docker_diag info >&2 || true
            docker_diag ps -a >&2 || true
            docker_diag events --since 1m --until 0s >&2 || true
            exit 1
          fi
          systemd_ready=0
          system_state=unknown
          for _ in $(seq 1 60); do
            # Bound each probe independently. A wedged PID 1 or blocked
            # systemctl call must not bypass the loop and consume the job's
            # entire timeout before diagnostics can be collected.
            # `is-system-running` exits nonzero for "degraded" as well as
            # "starting"; a container host commonly has an irrelevant failed
            # unit, so boot completion is the readiness condition here.
            system_state=$(docker_bounded 5s exec stepanel-install systemctl is-system-running 2>/dev/null || true)
            if [[ "$system_state" == running || "$system_state" == degraded ]]; then
              systemd_ready=1
              break
            fi
            sleep 2
          done
          if [[ "$system_state" == degraded ]]; then
            echo 'disposable systemd host booted degraded; failed units:' >&2
            docker_diag exec stepanel-install systemctl --failed --no-pager >&2 || true
          fi
          if [[ "$systemd_ready" != 1 ]]; then
            echo "disposable systemd host did not finish booting (state: ${system_state:-none})" >&2
            docker_diag exec stepanel-install systemctl list-jobs --no-pager >&2 || true
            docker_diag exec stepanel-install systemctl --failed --no-pager >&2 || true
            docker_diag logs --tail 200 stepanel-install >&2 || true
            exit 1
          fi
          echo "Disposable systemd host is ready (state: $system_state)."
      - name: Run installed-host install and recovery smoke
        env:
          DB: ${{ matrix.db }}
          WEB: ${{ matrix.web }}
        run: |
          set -eu
          docker_bounded() {
            local deadline=$1
            shift
            timeout --foreground --kill-after=2s "$deadline" docker "$@"
          }
          docker_diag() { docker_bounded 10s "$@"; }
          diagnostics_dir="$RUNNER_TEMP/stepanel-install-diagnostics"
          mkdir -p "$diagnostics_dir"
          recovery_identity="${GITHUB_RUN_ID}-${RECOVERY_MATRIX_SHARD:-default}-${{ matrix.name }}"
          recovery_prefix="g$(printf '%s' "$recovery_identity" | sha256sum | cut -c1-12)"
          cleanup() { timeout --foreground --kill-after=2s 15s docker rm -f stepanel-install >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          running=$(docker_diag inspect --format '{{.State.Running}}' stepanel-install 2>/dev/null || true)
          if [[ "$running" != true ]]; then
            echo "disposable systemd host is not running (state: ${running:-unknown})" >&2
            docker_diag logs --tail 200 stepanel-install >&2 || true
            exit 1
          fi
          set +e
          # Bound host-install validation so a stuck package manager or
          # service transition yields diagnostics rather than consuming the
          # entire matrix job timeout. Two Ubuntu runs reached the prior
          # 80-minute deadline while apt was still provisioning vsftpd; allow
          # 140 minutes by default and preserve ten minutes for diagnostics.
          # One full recovery iteration needs substantially more wall-clock
          # time on TCG/shared CI hosts. Give it 350 minutes and leave ten
          # minutes for diagnostics inside the six-hour GitHub job limit.
          timeout --foreground --kill-after=5s ${{ inputs.full_recovery_matrix && '350m' || '140m' }} docker exec \
            -e STEPANEL_DB_ENGINE="$DB" -e STEPANEL_WEBSERVER="$WEB" \
            -e STEPANEL_INSTALLER_PREEXISTING_APACHE_SMOKE="${{ matrix.name == 'ubuntu-24.04-caddy-mariadb' && '1' || '0' }}" \
            -e STEPANEL_UNSAFE_LAB=1 \
            -e STEPANEL_RUN_RECOVERY_MATRIX=1 \
            -e STEPANEL_RUN_RECOVERY_MATRIX_FULL=${{ inputs.full_recovery_matrix && '1' || '0' }} \
            -e RECOVERY_MATRIX_REPEATS="$RECOVERY_MATRIX_REPEATS" \
            -e RECOVERY_MATRIX_SHARD="$RECOVERY_MATRIX_SHARD" \
            -e RECOVERY_MATRIX_PREFIX="$recovery_prefix" \
            stepanel-install /work/deploy/lab/install-smoke.sh \
            2>&1 | tee "$diagnostics_dir/install-smoke-output.txt"
          smoke_status=${PIPESTATUS[0]}
          set -e
          if [[ "$smoke_status" != 0 ]]; then
            echo "install smoke exited with status $smoke_status; collecting host diagnostics" >&2
            cat "$diagnostics_dir/install-smoke-output.txt" >&2 || true
            docker_diag exec stepanel-install systemctl status stepanel.service stepanel-worker.service --no-pager >"$diagnostics_dir/systemctl-status.txt" 2>&1 || true
            docker_diag exec stepanel-install journalctl -u stepanel.service -u stepanel-worker.service --no-pager -n 200 >"$diagnostics_dir/journal.txt" 2>&1 || true
            docker_diag exec stepanel-install systemctl show stepanel.service stepanel-worker.service \
              -p ActiveState -p SubState -p Result -p ExecMainStatus -p MainPID \
              -p NoNewPrivileges -p RestrictSUIDSGID -p ProtectSystem -p ProtectHome \
              -p PrivateTmp -p PrivateDevices -p RestrictNamespaces -p ReadWritePaths >"$diagnostics_dir/systemctl-properties.txt" 2>&1 || true
            docker_diag exec stepanel-install systemctl status stepanel-root-broker.service --no-pager >"$diagnostics_dir/root-broker-status.txt" 2>&1 || true
            docker_diag exec stepanel-install sh -c 'systemctl list-unit-files --type=service --no-legend "php*-fpm.service" "php-fpm.service" | awk "{print \$1}" | xargs -r systemctl status --no-pager' >"$diagnostics_dir/php-fpm-status.txt" 2>&1 || true
            docker_diag exec stepanel-install sh -c 'systemctl list-unit-files --type=service --no-legend "php*-fpm.service" "php-fpm.service" | awk "{print \$1}" | xargs -r journalctl -n 200 --no-pager -u' >"$diagnostics_dir/php-fpm-journal.txt" 2>&1 || true
            docker_diag exec stepanel-install find /run/php /run/php-fpm -maxdepth 1 -type s -name "stepanel-*" -ls >"$diagnostics_dir/php-fpm-sockets.txt" 2>&1 || true
            docker_diag exec stepanel-install systemctl show stepanel-root-broker.service \
              -p ActiveState -p SubState -p Result -p ExecMainStatus -p MainPID \
              -p NoNewPrivileges -p PrivateDevices -p ProtectSystem -p RestrictNamespaces \
              -p ReadWritePaths >"$diagnostics_dir/root-broker-properties.txt" 2>&1 || true
            docker_diag exec stepanel-install systemctl cat stepanel-root-broker.service >"$diagnostics_dir/root-broker-unit.txt" 2>&1 || true
            docker_diag exec stepanel-install journalctl -u stepanel-root-broker.service --no-pager -n 200 >"$diagnostics_dir/root-broker-journal.txt" 2>&1 || true
            docker_diag logs --tail 200 stepanel-install >"$diagnostics_dir/container.log" 2>&1 || true
            cat "$diagnostics_dir"/*.txt "$diagnostics_dir"/*.log >&2 || true
            exit "$smoke_status"
          fi
          if [[ "$RUN_IDENTITY_REPAIR_SMOKE" == true ]]; then
            timeout --foreground --kill-after=5s 15m docker exec stepanel-install \
              /work/deploy/lab/identity-repair-smoke.sh
          fi
      - name: Remove disposable systemd host
        if: always()
        run: timeout --foreground 15s docker rm -f stepanel-install >/dev/null 2>&1 || true
      - name: Upload install diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stepanel-install-diagnostics-${{ inputs.recovery_matrix_shard || 'default' }}-${{ matrix.name }}
          path: ${{ runner.temp }}/stepanel-install-diagnostics
          if-no-files-found: ignore
