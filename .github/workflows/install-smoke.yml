name: Installation smoke

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: almalinux-9-caddy-mariadb
            image: almalinux:9-init
            db: mariadb
            web: caddy
          - name: rocky-9-caddy-mariadb
            image: rockylinux:9-init
            db: mariadb
            web: caddy
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: actions/setup-go@v5 # v5
        with:
          go-version: '1.26.7'
          cache: true
      - name: Build release-shaped installer tree
        run: go build -trimpath -ldflags='-s -w' -o stepanel .
      - name: Start disposable systemd host
        env:
          IMAGE: ${{ matrix.image }}
          DB: ${{ matrix.db }}
          WEB: ${{ matrix.web }}
        run: |
          set -eu
          cleanup() { docker rm -f stepanel-install >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker info >/dev/null 2>&1 || { echo 'Docker is unavailable on this runner' >&2; exit 77; }
          if [[ ! -f /sys/fs/cgroup/cgroup.controllers && ! -d /sys/fs/cgroup/systemd ]]; then
            echo 'Runner does not provide a systemd-compatible cgroup hierarchy' >&2
            exit 77
          fi
          docker run -d --privileged --name stepanel-install \
            --cgroupns=host \
            --tmpfs /run --tmpfs /run/lock \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "$PWD:/work" "$IMAGE" /sbin/init
          systemd_ready=0
          for _ in $(seq 1 30); do
            if docker exec stepanel-install systemctl is-system-running >/dev/null 2>&1; then
              systemd_ready=1
              break
            fi
            sleep 2
          done
          if [[ "$systemd_ready" != 1 ]]; then
            docker logs stepanel-install >&2 || true
            exit 1
          fi
          docker exec -e STEPANEL_DB_ENGINE="$DB" -e STEPANEL_WEBSERVER="$WEB" stepanel-install /work/deploy/lab/install-smoke.sh
