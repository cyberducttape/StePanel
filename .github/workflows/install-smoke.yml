name: Installation smoke

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: stepanel-install-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: almalinux-9-caddy-mariadb
            image: almalinux:9
            db: mariadb
            web: caddy
          - name: rocky-9-caddy-mariadb
            image: rockylinux:9
            db: mariadb
            web: caddy
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.7'
          cache: true
      - name: Build release-shaped installer tree
        run: |
          go build -trimpath -ldflags='-s -w' -o stepanel .
          go build -trimpath -ldflags='-s -w' -o stepanel-root ./cmd/stepanel-root
      - name: Build disposable systemd host image
        env:
          IMAGE: ${{ matrix.image }}
          HOST_IMAGE: stepanel-systemd-host:${{ matrix.name }}
        run: docker build --build-arg BASE_IMAGE="$IMAGE" -f deploy/lab/Dockerfile.systemd -t "$HOST_IMAGE" .
      - name: Start disposable systemd host
        env:
          IMAGE: ${{ matrix.image }}
          DB: ${{ matrix.db }}
          WEB: ${{ matrix.web }}
          HOST_IMAGE: stepanel-systemd-host:${{ matrix.name }}
        run: |
          set -eu
          diagnostics_dir="$RUNNER_TEMP/stepanel-install-diagnostics"
          mkdir -p "$diagnostics_dir"
          cleanup() { docker rm -f stepanel-install >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker info >/dev/null 2>&1 || { echo 'Docker is unavailable on this runner' >&2; exit 77; }
          if [[ ! -f /sys/fs/cgroup/cgroup.controllers && ! -d /sys/fs/cgroup/systemd ]]; then
            echo 'Runner does not provide a systemd-compatible cgroup hierarchy' >&2
            exit 77
          fi
          if ! timeout --foreground 30s docker run -d --privileged --name stepanel-install \
              --security-opt=no-new-privileges:false \
              --userns=host \
              --cgroupns=host \
              --tmpfs /run --tmpfs /run/lock \
              -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
              -v "$PWD:/work" "$HOST_IMAGE" /sbin/init; then
            echo 'Docker did not create the disposable systemd host within 30 seconds' >&2
            docker info >&2 || true
            docker ps -a >&2 || true
            docker events --since 1m --until 0s >&2 || true
            exit 1
          fi
          systemd_ready=0
          for _ in $(seq 1 30); do
            # Bound each probe independently. A wedged PID 1 or blocked
            # systemctl call must not bypass the loop and consume the job's
            # entire timeout before diagnostics can be collected.
            if timeout --foreground 5s docker exec stepanel-install systemctl is-system-running >/dev/null 2>&1; then
              systemd_ready=1
              break
            fi
            sleep 2
          done
          if [[ "$systemd_ready" != 1 ]]; then
            docker logs stepanel-install >&2 || true
            exit 1
          fi
          set +e
          # Bound host-install validation so a stuck package manager or
          # service transition yields diagnostics rather than consuming the
          # entire matrix job timeout. The optional recovery matrix runs
          # after the default drills and needs more than the original 20m
          # budget while remaining below this job's 45m timeout. The full
          # matrix exercises every restore checkpoint and therefore needs the
          # additional wall-clock budget on TCG/shared CI hosts.
          timeout --foreground 42m docker exec \
            -e STEPANEL_DB_ENGINE="$DB" -e STEPANEL_WEBSERVER="$WEB" \
            -e STEPANEL_RUN_RECOVERY_MATRIX=1 \
            -e STEPANEL_RUN_RECOVERY_MATRIX_FULL=1 \
            stepanel-install /work/deploy/lab/install-smoke.sh \
            >"$diagnostics_dir/install-smoke-output.txt" 2>&1
          smoke_status=$?
          set -e
          if [[ "$smoke_status" != 0 ]]; then
            echo "install smoke exited with status $smoke_status; collecting host diagnostics" >&2
            cat "$diagnostics_dir/install-smoke-output.txt" >&2 || true
            docker exec stepanel-install systemctl status stepanel.service stepanel-worker.service --no-pager >"$diagnostics_dir/systemctl-status.txt" 2>&1 || true
            docker exec stepanel-install journalctl -u stepanel.service -u stepanel-worker.service --no-pager -n 200 >"$diagnostics_dir/journal.txt" 2>&1 || true
            docker exec stepanel-install systemctl show stepanel.service stepanel-worker.service \
              -p ActiveState -p SubState -p Result -p ExecMainStatus -p MainPID \
              -p NoNewPrivileges -p RestrictSUIDSGID -p ProtectSystem -p ProtectHome \
              -p PrivateTmp -p PrivateDevices -p RestrictNamespaces -p ReadWritePaths >"$diagnostics_dir/systemctl-properties.txt" 2>&1 || true
            docker logs stepanel-install >"$diagnostics_dir/container.log" 2>&1 || true
            cat "$diagnostics_dir"/*.txt "$diagnostics_dir"/*.log >&2 || true
            exit "$smoke_status"
          fi
      - name: Upload install diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stepanel-install-diagnostics-${{ matrix.name }}
          path: ${{ runner.temp }}/stepanel-install-diagnostics
          if-no-files-found: ignore
