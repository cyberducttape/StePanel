name: Quota-enabled production install smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stepanel-quota-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quota-install:
    # Exercise the production installer against a real ext4 user-quota mount
    # inside an isolated systemd host container. The hosted runner itself does
    # not grant mount privileges, so loop setup stays inside the privileged
    # disposable host rather than its outer VM.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.7'
          cache: true
      - name: Build release-shaped installer tree
        run: |
          go build -trimpath -ldflags='-s -w' -o stepanel .
          go build -trimpath -ldflags='-s -w' -o stepanel-root ./cmd/stepanel-root
      - name: Install on a quota-enabled disposable systemd host
        run: |
          set -Eeuo pipefail
          diagnostics_dir="$RUNNER_TEMP/stepanel-quota-diagnostics"
          mkdir -p "$diagnostics_dir"
          cleanup() {
            sudo docker rm -f stepanel-quota-install >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker build --build-arg BASE_IMAGE=ubuntu:24.04 -f deploy/lab/Dockerfile.systemd -t stepanel-quota-systemd .
          sudo docker run -d --privileged --name stepanel-quota-install \
            --security-opt=no-new-privileges:false --userns=host --cgroupns=host \
            --tmpfs /run --tmpfs /run/lock \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "$PWD:/work" \
            stepanel-quota-systemd /sbin/init
          systemd_ready=0
          for _ in $(seq 1 30); do
            if timeout --foreground 5s sudo docker exec stepanel-quota-install systemctl is-system-running >/dev/null 2>&1; then
              systemd_ready=1
              break
            fi
            sleep 2
          done
          test "$systemd_ready" = 1 || { sudo docker logs stepanel-quota-install >&2; exit 1; }
          sudo docker exec stepanel-quota-install bash -lc '
            set -Eeuo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y e2fsprogs quota
            install -d -m 0755 /var/www
            truncate -s 2G /var/lib/stepanel-quota.ext4
            mkfs.ext4 -F -O quota /var/lib/stepanel-quota.ext4
            loop_device=$(losetup --find --show /var/lib/stepanel-quota.ext4)
            mount -o usrquota "$loop_device" /var/www
            quotaon -v -u /var/www
            quotaon -p -u /var/www
          '
          set +e
          timeout --foreground 30m sudo docker exec \
            -e STEPANEL_QUOTA_SMOKE=1 -e STEPANEL_DB_ENGINE=mariadb -e STEPANEL_WEBSERVER=caddy \
            stepanel-quota-install /work/deploy/lab/install-smoke.sh \
            >"$diagnostics_dir/install-output.txt" 2>&1
          smoke_status=$?
          set -e
          if [[ "$smoke_status" != 0 ]]; then
            sudo docker exec stepanel-quota-install systemctl status stepanel.service stepanel-worker.service --no-pager >"$diagnostics_dir/systemctl-status.txt" 2>&1 || true
            sudo docker exec stepanel-quota-install journalctl -u stepanel.service -u stepanel-worker.service --no-pager -n 200 >"$diagnostics_dir/journal.txt" 2>&1 || true
            sudo docker logs stepanel-quota-install >"$diagnostics_dir/container.log" 2>&1 || true
            cat "$diagnostics_dir"/* >&2 || true
            exit "$smoke_status"
          fi
