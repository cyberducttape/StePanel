name: Quota-enabled production install smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stepanel-quota-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quota-install:
    # Run the installer in a genuine guest because the hosted runner's outer
    # mount namespace cannot create loop mounts. TCG avoids requiring nested KVM.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          cache: true
      - name: Build release-shaped installer tree
        run: |
          go build -trimpath -ldflags='-s -w' -o stepanel .
          go build -trimpath -ldflags='-s -w' -o stepanel-root ./cmd/stepanel-root
          go test -c -trimpath -o stepanel-enospc.test .
      - name: Boot quota-enabled disposable Ubuntu guest and install
        run: |
          set -Eeuo pipefail
          vm_root="$RUNNER_TEMP/stepanel-quota-vm"
          mkdir -p "$vm_root"
          sudo apt-get update
          sudo apt-get install -y cloud-image-utils openssh-client qemu-system-x86 qemu-utils

          image_url=https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
          guest_image="$vm_root/noble-server-cloudimg-amd64.img"
          curl --fail --silent --show-error --location "$image_url" -o "$guest_image"
          curl --fail --silent --show-error --location https://cloud-images.ubuntu.com/noble/current/SHA256SUMS -o "$vm_root/SHA256SUMS"
          (cd "$vm_root" && grep 'noble-server-cloudimg-amd64.img$' SHA256SUMS | sha256sum --check --status)
          qemu-img resize "$guest_image" 12G
          qemu-img create -f raw "$vm_root/www.ext4" 2G
          qemu-img create -f raw "$vm_root/enospc.ext4" 96M

          ssh-keygen -q -t ed25519 -N '' -f "$vm_root/id_ed25519"
          vm_pubkey=$(<"$vm_root/id_ed25519.pub")
          cat > "$vm_root/user-data" <<EOF
          #cloud-config
          users:
            - default
            - name: vmtest
              shell: /bin/bash
              sudo: ALL=(ALL) NOPASSWD:ALL
              ssh_authorized_keys:
                - $vm_pubkey
          package_update: true
          packages:
            - cloud-init
            - e2fsprogs
            - openssh-server
            - quota
          runcmd:
            - |
              set -eux
              mkfs.ext4 -F /dev/vdb
              install -d -m 0755 /var/www
              printf '%s\\n' '/dev/vdb /var/www ext4 usrquota 0 2' >> /etc/fstab
              mount /var/www
              apt-get install -y "linux-modules-extra-\$(uname -r)"
              modprobe quota_v2
              quotacheck -cugm /var/www
              quotaon -u /var/www
              quotaon -p -u /var/www | grep -F 'user quota on /var/www'
              mkfs.ext4 -F /dev/vdc
              install -d -m 0700 /mnt/stepanel-enospc
              mount /dev/vdc /mnt/stepanel-enospc
              touch /run/stepanel-quota-ready
          EOF
          cloud-localds "$vm_root/seed.iso" "$vm_root/user-data"

          qemu-system-x86_64 \
            -machine accel=tcg \
            -cpu max -smp 2 -m 4096 \
            -drive "file=$guest_image,if=virtio,format=qcow2" \
            -drive "file=$vm_root/www.ext4,if=virtio,format=raw" \
            -drive "file=$vm_root/enospc.ext4,if=virtio,format=raw" \
            -drive "file=$vm_root/seed.iso,if=virtio,media=cdrom,readonly=on" \
            -netdev user,id=net0,hostfwd=tcp:127.0.0.1:2222-:22 \
            -device virtio-net-pci,netdev=net0 \
            -display none -serial "file:$vm_root/console.log" -monitor none \
            -daemonize -pidfile "$vm_root/qemu.pid"

          cleanup() {
            status=$?
            if (( status != 0 )); then
              cat "$vm_root/console.log" >&2 2>/dev/null || true
              timeout --foreground 20s ssh -i "$vm_root/id_ed25519" -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=2 vmtest@127.0.0.1 \
                'sudo journalctl -b --no-pager -n 200; sudo findmnt /var/www; sudo quotaon -p -u /var/www' >&2 || true
            fi
            if [[ -s "$vm_root/qemu.pid" ]]; then
              kill "$(<"$vm_root/qemu.pid")" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          ssh_args=(-i "$vm_root/id_ed25519" -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=3)
          guest_ready=0
          for _ in $(seq 1 240); do
            if timeout --foreground 20s ssh "${ssh_args[@]}" vmtest@127.0.0.1 'sudo cloud-init status --wait >/dev/null && test -e /run/stepanel-quota-ready'; then
              guest_ready=1
              break
            fi
            cloud_init_status=$(timeout --foreground 20s ssh "${ssh_args[@]}" vmtest@127.0.0.1 'sudo cloud-init status --format json' 2>/dev/null || true)
            if grep -Eq '"(status|extended_status)"[[:space:]]*:[[:space:]]*"(error|degraded)"' <<< "$cloud_init_status"; then
              echo 'quota-enabled Ubuntu guest cloud-init failed' >&2
              timeout --foreground 20s ssh "${ssh_args[@]}" vmtest@127.0.0.1 'sudo cloud-init status --long; sudo tail -n 120 /var/log/cloud-init-output.log' >&2 || true
              exit 1
            fi
            sleep 5
          done
          test "$guest_ready" = 1 || { echo 'quota-enabled Ubuntu guest did not finish cloud-init' >&2; exit 1; }

          tar -czf "$vm_root/stepanel-source.tar.gz" --exclude=.git -C "$GITHUB_WORKSPACE" .
          timeout --foreground 30s scp -i "$vm_root/id_ed25519" -P 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=3 \
            "$vm_root/stepanel-source.tar.gz" vmtest@127.0.0.1:/tmp/stepanel-source.tar.gz
          timeout --foreground 30s ssh "${ssh_args[@]}" vmtest@127.0.0.1 'sudo mkdir -p /work && sudo tar -xzf /tmp/stepanel-source.tar.gz -C /work'
          timeout --foreground 20s ssh "${ssh_args[@]}" vmtest@127.0.0.1 \
            'sudo findmnt -no OPTIONS /var/www | tr "," "\\n" | grep -Fx usrquota && sudo quotaon -p -u /var/www | grep -F "user quota on /var/www"'
          install_log="$vm_root/install-smoke-output.log"
          set +e
          timeout --foreground 45m ssh "${ssh_args[@]}" vmtest@127.0.0.1 \
            'sudo env STEPANEL_QUOTA_SMOKE=1 STEPANEL_DB_ENGINE=mariadb STEPANEL_WEBSERVER=caddy bash /work/deploy/lab/install-smoke.sh' \
            2>&1 | tee "$install_log"
          install_status=${PIPESTATUS[0]}
          set -e
          if (( install_status != 0 )); then
            echo "quota-enabled install smoke failed with status $install_status" >&2
            cat "$install_log" >&2 || true
            exit "$install_status"
          fi
          timeout --foreground 10m ssh "${ssh_args[@]}" vmtest@127.0.0.1 \
            'sudo test "$(findmnt -n -o FSTYPE --target /mnt/stepanel-enospc)" = ext4 && sudo test "$(findmnt -n -o SOURCE --target /mnt/stepanel-enospc)" = /dev/vdc && sudo env STEPANEL_ENOSPC_BACKUP_ROOT=/mnt/stepanel-enospc /work/stepanel-enospc.test -test.run "^TestBackupRecoversFromRealENOSPC$" -test.v'
