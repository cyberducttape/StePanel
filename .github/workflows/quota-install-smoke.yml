name: Quota-enabled production install smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stepanel-quota-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quota-install:
    # Run the installer in a genuine guest because the hosted runner's outer
    # mount namespace cannot create loop mounts. TCG avoids requiring nested KVM.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.7'
          cache: true
      - name: Build release-shaped installer tree
        run: |
          go build -trimpath -ldflags='-s -w' -o stepanel .
          go build -trimpath -ldflags='-s -w' -o stepanel-root ./cmd/stepanel-root
      - name: Boot quota-enabled disposable Ubuntu guest and install
        run: |
          set -Eeuo pipefail
          vm_root="$RUNNER_TEMP/stepanel-quota-vm"
          mkdir -p "$vm_root"
          sudo apt-get update
          sudo apt-get install -y cloud-image-utils openssh-client qemu-system-x86 qemu-utils

          image_url=https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
          guest_image="$vm_root/noble-server-cloudimg-amd64.img"
          curl --fail --silent --show-error --location "$image_url" -o "$guest_image"
          curl --fail --silent --show-error --location https://cloud-images.ubuntu.com/noble/current/SHA256SUMS -o "$vm_root/SHA256SUMS"
          (cd "$vm_root" && grep 'noble-server-cloudimg-amd64.img$' SHA256SUMS | sha256sum --check --status)
          qemu-img resize "$guest_image" 12G
          qemu-img create -f raw "$vm_root/www.ext4" 2G

          ssh-keygen -q -t ed25519 -N '' -f "$vm_root/id_ed25519"
          vm_pubkey=$(<"$vm_root/id_ed25519.pub")
          cat > "$vm_root/user-data" <<EOF
          #cloud-config
          users:
            - default
            - name: vmtest
              shell: /bin/bash
              sudo: ALL=(ALL) NOPASSWD:ALL
              ssh_authorized_keys:
                - $vm_pubkey
          package_update: true
          packages:
            - cloud-init
            - e2fsprogs
            - openssh-server
            - quota
          runcmd:
            - |
              set -eux
              mkfs.ext4 -F -O quota /dev/vdb
              install -d -m 0755 /var/www
              printf '%s\\n' '/dev/vdb /var/www ext4 usrquota 0 2' >> /etc/fstab
              mount /var/www
              quotaon -u /var/www
              quotaon -p -u /var/www
              touch /run/stepanel-quota-ready
          EOF
          cloud-localds "$vm_root/seed.iso" "$vm_root/user-data"

          qemu-system-x86_64 \
            -machine accel=tcg \
            -cpu max -smp 2 -m 4096 \
            -drive "file=$guest_image,if=virtio,format=qcow2" \
            -drive "file=$vm_root/www.ext4,if=virtio,format=raw" \
            -drive "file=$vm_root/seed.iso,if=virtio,media=cdrom,readonly=on" \
            -netdev user,id=net0,hostfwd=tcp:127.0.0.1:2222-:22 \
            -device virtio-net-pci,netdev=net0 \
            -display none -serial "file:$vm_root/console.log" -monitor none \
            -daemonize -pidfile "$vm_root/qemu.pid"

          cleanup() {
            status=$?
            if (( status != 0 )); then
              cat "$vm_root/console.log" >&2 2>/dev/null || true
              ssh -i "$vm_root/id_ed25519" -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=2 vmtest@127.0.0.1 \
                'sudo journalctl -b --no-pager -n 200; sudo findmnt /var/www; sudo quotaon -p -u /var/www' >&2 || true
            fi
            if [[ -s "$vm_root/qemu.pid" ]]; then
              kill "$(<"$vm_root/qemu.pid")" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          ssh_args=(-i "$vm_root/id_ed25519" -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=3)
          guest_ready=0
          for _ in $(seq 1 240); do
            if ssh "${ssh_args[@]}" vmtest@127.0.0.1 'sudo cloud-init status --wait >/dev/null && test -e /run/stepanel-quota-ready'; then
              guest_ready=1
              break
            fi
            sleep 5
          done
          test "$guest_ready" = 1 || { echo 'quota-enabled Ubuntu guest did not finish cloud-init' >&2; exit 1; }

          tar -czf "$vm_root/stepanel-source.tar.gz" --exclude=.git -C "$GITHUB_WORKSPACE" .
          scp -i "$vm_root/id_ed25519" -P 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=3 \
            "$vm_root/stepanel-source.tar.gz" vmtest@127.0.0.1:/tmp/stepanel-source.tar.gz
          ssh "${ssh_args[@]}" vmtest@127.0.0.1 'sudo mkdir -p /work && sudo tar -xzf /tmp/stepanel-source.tar.gz -C /work'
          ssh "${ssh_args[@]}" vmtest@127.0.0.1 \
            'sudo findmnt -no OPTIONS /var/www | tr "," "\\n" | grep -Fx usrquota && sudo quotaon -p -u /var/www'
          ssh "${ssh_args[@]}" vmtest@127.0.0.1 \
            'sudo env STEPANEL_QUOTA_SMOKE=1 STEPANEL_DB_ENGINE=mariadb STEPANEL_WEBSERVER=caddy bash /work/deploy/lab/install-smoke.sh'
