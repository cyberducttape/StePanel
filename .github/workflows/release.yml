name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5 # v5
        with:
          go-version: '1.26.7'
      - name: Verify tag matches source version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          source_version=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' version.go)
          tag_version=${RELEASE_TAG#v}
          test -n "$source_version" || { echo 'version.go does not declare Version' >&2; exit 1; }
          test "$source_version" = "$tag_version" || {
            echo "release tag $RELEASE_TAG does not match version.go ($source_version)" >&2
            exit 1
          }
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/main" || {
            echo "release tag must point to a commit already reachable from main" >&2
            exit 1
          }
          make release-check
      - name: Verify immutable release toolchain pins
        run: |
          grep -Eq 'goreleaser/goreleaser-action@[0-9a-f]{40} +# v[0-9]+\.[0-9]+\.[0-9]+' .github/workflows/release.yml
          ! grep -Eq 'goreleaser/goreleaser-action@(v|main|master)' .github/workflows/release.yml
          grep -Eq "version: '[v]?[0-9]+\.[0-9]+\.[0-9]+'" .github/workflows/release.yml
          ! grep -Eq "version: '[^']*~>" .github/workflows/release.yml
      - name: Build and publish release artifacts with GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: 'v2.17.1'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify release artifacts
        run: bash scripts/verify-release-artifacts.sh dist/
      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/SBOM.spdx.json
      - name: Attest release provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/itchyitchy123/stepanel:${{ github.ref_name }}
      - name: Attach SBOM to GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/SBOM.spdx.json
