name: N-1 upgrade smoke

on:
  schedule:
    - cron: '11 5 * * 5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache: true
      - name: Build N-1 and candidate installer trees
        run: |
          set -eu
          mkdir -p /tmp/stepanel-v0.6.0 /tmp/stepanel-candidate /tmp/stepanel-broken
          git archive v0.6.0 | tar -x -C /tmp/stepanel-v0.6.0
          tar -C "$GITHUB_WORKSPACE" --exclude=.git -cf - . | tar -x -C /tmp/stepanel-candidate
          # v0.6.0 shipped a systemd LoadCredential unit with a root-only
          # source file. The current supported service contract uses the
          # service-readable credential file and direct path; normalize only
          # this disposable N-1 fixture so the test reaches the migration
          # and rollback assertions instead of failing while bootstrapping an
          # obsolete credential handoff.
          sed -i '/^LoadCredential=db-password:/d; s#Environment=STEPANEL_DB_PASSWORD_FILE=%d/db-password#Environment=STEPANEL_DB_PASSWORD_FILE=/etc/stepanel-db.password#' /tmp/stepanel-v0.6.0/deploy/stepanel.service
          sed -i 's/install -m 0600 -o root -g root "\$INSTALL_TXN\/stepanel-db.password"/install -m 0640 -o root -g "\$APP_USER" "\$INSTALL_TXN\/stepanel-db.password"/' /tmp/stepanel-v0.6.0/install.sh
          sed -i 's|^  if \[\[ "\$DB_LOCAL_HELPER" == "1" \]\]; then write_env STEPANEL_DBCTL|  if false; then write_env STEPANEL_DBCTL|' /tmp/stepanel-v0.6.0/install.sh
          (cd /tmp/stepanel-v0.6.0 && go build -trimpath -ldflags='-s -w' -o stepanel .)
          (cd /tmp/stepanel-candidate && go build -trimpath -ldflags='-s -w' -o stepanel ./cmd/stepanel && go build -trimpath -ldflags='-s -w' -o stepanel-root ./cmd/stepanel-root)
          cp -a /tmp/stepanel-candidate/. /tmp/stepanel-broken/
          mv /tmp/stepanel-broken/stepanel /tmp/stepanel-broken/stepanel.real
          install -m 0755 /tmp/stepanel-candidate/deploy/lab/broken-candidate.sh /tmp/stepanel-broken/stepanel
      - name: Build disposable systemd host image
        run: docker build --build-arg BASE_IMAGE=ubuntu:24.04 -f deploy/lab/Dockerfile.systemd -t stepanel-upgrade-systemd-host .
      - name: Upgrade v0.6.0 on a disposable systemd host
        run: |
          set -eu
          docker run -d --privileged --name stepanel-upgrade \
            --cgroupns=host \
            --tmpfs /run --tmpfs /run/lock \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v /tmp/stepanel-v0.6.0:/work/previous:ro \
            -v /tmp/stepanel-candidate:/work/candidate:ro \
            -v /tmp/stepanel-broken:/work/broken:ro \
            stepanel-upgrade-systemd-host /sbin/init
          cleanup() { docker rm -f stepanel-upgrade >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          systemd_ready=0
          for _ in $(seq 1 30); do
            if docker exec stepanel-upgrade systemctl is-system-running >/dev/null 2>&1; then
              systemd_ready=1
              break
            fi
            sleep 2
          done
          if [[ "$systemd_ready" != 1 ]]; then
            docker logs stepanel-upgrade >&2 || true
            exit 1
          fi
          set +e
          docker exec stepanel-upgrade /work/candidate/deploy/lab/upgrade-smoke.sh /work/previous /work/candidate /work/broken
          smoke_status=$?
          if [[ "$smoke_status" != 0 ]]; then
            echo '--- upgrade smoke output diagnostics ---' >&2
            docker exec stepanel-upgrade systemctl status stepanel.service stepanel-worker.service --no-pager >&2 || true
            docker exec stepanel-upgrade journalctl -u stepanel.service -u stepanel-worker.service --no-pager -n 200 >&2 || true
            docker exec stepanel-upgrade sh -c 'curl -sS http://127.0.0.1:8090/readyz || true' >&2 || true
            docker logs stepanel-upgrade >&2 || true
          fi
          exit "$smoke_status"
