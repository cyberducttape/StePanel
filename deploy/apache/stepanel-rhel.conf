# Replace panel.example.com with the real hostname and enable HTTPS.
IncludeOptional /etc/httpd/conf.d/stepanel-proxy/*.conf
IncludeOptional /etc/httpd/conf.d/stepanel-sites/*.conf

<VirtualHost *:80>
    ServerName panel.example.com
    IncludeOptional /etc/httpd/stepanel-panel/*.conf
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8090/ timeout=3700
    ProxyPassReverse / http://127.0.0.1:8090/
    ProxyTimeout 3700
    RequestHeader set X-Forwarded-Proto "http"
    ErrorLog /var/log/httpd/stepanel-error.log
    CustomLog /var/log/httpd/stepanel-access.log combined
</VirtualHost>
