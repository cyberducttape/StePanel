{{- define "stepanel.labels" -}}
app.kubernetes.io/name: stepanel
app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "replicaCount must be 1 because jobs and persistent state are process-local" }}
{{- end }}
{{- if and .Values.ingress.enabled (eq (len .Values.ingress.tls) 0) }}
{{- fail "ingress.tls must be configured when ingress is enabled" }}
{{- end }}
{{- if and .Values.networkPolicy.enabled (eq (len .Values.networkPolicy.ingressNamespaceSelector) 0) }}
{{- fail "networkPolicy.ingressNamespaceSelector must identify the trusted ingress namespace" }}
{{- end }}
{{- if not .Values.ingress.enabled }}
{{- fail "ingress.enabled must be true for production TLS termination" }}
{{- end }}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" .Values.image.digest) }}
{{- fail "image.digest must be an immutable sha256 digest" }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-stepanel
  labels:
    {{- include "stepanel.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "stepanel.labels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-stepanel
  labels:
    {{- include "stepanel.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "stepanel.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stepanel.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      # Match the application's two-hour restore drain plus a five-minute margin.
      terminationGracePeriodSeconds: 7500
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: stepanel
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          env:
            - {name: STEPANEL_ENV, value: "production"}
            - {name: STEPANEL_LISTEN, value: ":8080"}
            {{- if .Values.ingress.enabled }}
            # The configured TLS ingress terminates HTTPS before forwarding here.
            - {name: STEPANEL_TLS_TERMINATED, value: "1"}
            {{- end }}
            - {name: STEPANEL_REQUIRE_OFFSITE_BACKUP, value: "1"}
            - {name: STEPANEL_SESSION_STATE, value: "/var/lib/ste-panel/sessions.json"}
            - {name: STEPANEL_CONTROL_PLANE_DB, value: "/var/lib/ste-panel/control-plane.db"}
            - {name: STEPANEL_IMPORT_ROOT, value: "/var/lib/ste-panel/imports"}
            - {name: STEPANEL_BACKUP_ROOT, value: "/var/lib/ste-panel/backups"}
            - {name: STEPANEL_WEB_ROOT, value: "/var/www"}
            - {name: STEPANEL_MAIL_ROOT, value: "/var/lib/ste-panel/mail"}
            - {name: STEPANEL_NVM_DIR, value: "/var/lib/ste-panel/nvm"}
            - {name: STEPANEL_PROXY_ROOT, value: "/var/lib/ste-panel/proxy"}
            - {name: STEPANEL_VHOST_ROOT, value: "/var/lib/ste-panel/vhosts"}
            - {name: STEPANEL_APP_ROOT, value: "/var/lib/ste-panel/apps"}
            - {name: STEPANEL_MALWARE_ROOT, value: "/var/lib/ste-panel/quarantine"}
            - {name: STEPANEL_AUDIT_LOG, value: "/var/lib/ste-panel/audit.jsonl"}
            - {name: STEPANEL_JOB_STATE, value: "/var/lib/ste-panel/jobs.json"}
            - {name: STEPANEL_RECOVERY_ROOT, value: "/var/www/sites/.stepanel-recovery"}
            - name: STEPANEL_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.existingSecret }}, key: admin-password}}
            - name: STEPANEL_SESSION_SECRET
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.existingSecret }}, key: session-secret}}
            - name: STEPANEL_AUDIT_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.existingSecret }}, key: audit-key}}
            - name: STEPANEL_ADMIN_TOTP_SECRET
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.existingSecret }}, key: admin-totp-secret}}
            - name: STEPANEL_ACCOUNT_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.existingSecret }}, key: account-key}}
            - name: STEPANEL_ENVIRONMENT_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.existingSecret }}, key: environment-key}}
            - name: STEPANEL_BACKUP_SIGNING_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.existingSecret }}, key: backup-signing-key}}
            - name: STEPANEL_BACKUP_ENCRYPTION_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.existingSecret }}, key: backup-encryption-key}}
            - name: STEPANEL_OFFSITE_TARGET
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.existingSecret }}, key: offsite-target}}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /livez, port: http}, initialDelaySeconds: 15, periodSeconds: 20, timeoutSeconds: 2, failureThreshold: 3}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: stepanel-data, mountPath: /var/lib/ste-panel}
            - {name: stepanel-sites, mountPath: /var/www/sites}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: stepanel-data
          {{ if .Values.persistence.enabled }}
          persistentVolumeClaim: {claimName: {{ .Release.Name }}-stepanel-data}
          {{ else }}
          emptyDir: {}
          {{ end }}
        - name: stepanel-sites
          {{ if .Values.persistence.enabled }}
          persistentVolumeClaim: {claimName: {{ .Release.Name }}-stepanel-sites}
          {{ else }}
          emptyDir: {}
          {{ end }}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
{{- if .Values.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-stepanel-data
spec:
  accessModes:
{{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources: {requests: {storage: {{ .Values.persistence.size }}}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-stepanel-sites
spec:
  accessModes:
{{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources: {requests: {storage: {{ .Values.persistence.size }}}}
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-stepanel
  labels:
    {{- include "stepanel.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-stepanel
                port:
                  number: {{ .Values.service.port }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-stepanel-ingress
  labels:
    {{- include "stepanel.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "stepanel.labels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-stepanel
  labels:
    {{- include "stepanel.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "stepanel.labels" . | nindent 6 }}
