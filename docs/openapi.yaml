openapi: 3.0.3
info:
  title: StePanel API
  version: 0.7.0
  description: |
    Authenticated server operations, service inventory, and migration API.
    Mutating requests require the `stepanel_session` cookie and the matching
    `stepanel_csrf` value in the `X-CSRF-Token` header or `csrf` form field.
    Responses include an `X-Request-ID` correlation identifier.
servers:
  - url: http://127.0.0.1:8090
security:
  - sessionCookie: []
paths:

  /api/health/operational:
    get:
      summary: Operational health diagnostics
      description: Administrator-only operational alerts; these do not determine service readiness.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Operational health report
        '503':
          description: One or more operational checks are degraded
  /api/database:
    get:
      summary: Database engine and administration UI status
      responses:
        '200':
          description: Selected database engine, service health, client availability, and matching admin UI readiness
  /api/database/diagnostics:
    get:
      summary: Bounded database health counters
      responses:
        '200': {description: Connections, long transactions, blocking, deadlocks, and allocated database bytes}
        '503': {description: Restricted local database diagnostics are unavailable}
  /api/database/settings:
    get:
      summary: Read-only effective database settings allowlist
      responses:
        '200': {description: Engine-specific capacity, logging, memory, and recovery settings}
  /api/database/sessions:
    get:
      summary: Active database session metadata without SQL text
      responses:
        '200': {description: Up to 200 sessions with age, state, and wait class}
  /api/database/sessions/:
    delete:
      summary: Terminate one database session after exact confirmation
      responses:
        '204': {description: Session terminated and action audited}
        '422': {description: Confirmation must exactly match TERMINATE plus the session ID}
  /api/databases:
    get:
      summary: List site-owned databases managed by StePanel
      responses:
        '200': {description: Database, owner, user, encoding, and allocated bytes}
    post:
      summary: Create a database and least-privilege site user
      responses:
        '201': {description: Database and user created; password is never returned or stored by StePanel}
        '409': {description: Object already exists or provisioning failed safely}
  /api/databases/:
    get:
      summary: Inspect one managed database without exposing credentials
      responses:
        '200': {description: Database owner, user, encoding, and allocated bytes}
        '404': {description: Managed database not found}
    delete:
      summary: Create a safety dump, then delete a managed database and user
      responses:
        '200': {description: Database deleted with safety-backup path and checksum}
        '503': {description: Deletion refused because the safety backup failed}
    patch:
      summary: Rotate a managed database user's password
      responses:
        '204': {description: Credential rotated; caller must update the application secret}
  /api/databases/{name}/deletion-preview:
    get:
      summary: Preview managed database deletion before confirmation
      description: Requires database:write scope. Returns current database inventory, verified safety-backup behavior, service impact, and a preview token bound to the inventory.
      responses:
        '200': {description: Deletion plan and preview token}
        '404': {description: Managed database not found}
        '503': {description: Database inventory is unavailable}
  /livez:
    get:
      security: []
      summary: Process liveness only
      responses:
        '204': {description: Process event loop is responding}
  /readyz:
    get:
      security: []
      summary: Persistent state and storage capacity readiness
      responses:
        '200': {description: Control plane can safely accept work}
        '503': {description: Job persistence or a managed filesystem is unavailable or below its free-space floor}
  /api/health:
    get:
      security: []
      summary: Process health
      responses:
        '200': {description: Healthy process}
  /api/services:
    get:
      summary: Service inventory
      responses:
        '200': {description: Service inventory}
  /api/node/versions:
    get:
      summary: List installed NVM Node versions
      responses:
        '200': {description: Installed versions}
  /api/node/select:
    post:
      summary: Select the Node version for a managed site
      responses:
        '200': {description: Version selected}
  /api/node/tooling:
    get:
      summary: Get Node.js runtime status
      responses:
        '200': {description: Node versions and tools}
  /api/proxy:
    get:
      summary: List managed reverse proxies
      responses:
        '200': {description: Managed reverse proxies}
  /api/proxy/deploy:
    post:
      summary: Deploy and reload a validated reverse proxy
      responses:
        '202': {description: Proxy deployed}
  /api/proxy/test:
    post:
      summary: Test a local or private backend
      responses:
        '200': {description: Backend reachability result}
  /api/proxy/:
    delete:
      summary: Remove a managed reverse proxy
      responses:
        '200': {description: Proxy removed}
  /api/caddy/htaccess:
    post:
      summary: Preview or apply a constrained Apache .htaccess conversion
      description: Applying requires Caddy and refuses unsupported directives unless allow_partial is explicitly enabled.
      responses:
        '200': {description: Conversion preview}
        '202': {description: Converted rules validated and applied}
        '422': {description: Unsupported or invalid directives require operator review}
  /api/apps:
    get:
      summary: List managed Node applications
      responses:
        '200': {description: Managed applications}
  /api/apps/deploy:
    post:
      summary: Deploy a managed Node application
      responses:
        '202': {description: Application deployed}
  /api/apps/:
    post:
      summary: Start, stop, restart, or roll back an application
      responses:
        '202': {description: Action accepted}
  /api/composer/:
    get:
      summary: Inspect Composer project files and last operation
      responses:
        '200': {description: Composer status}
  /api/python/:
    get:
      summary: List Python runtime configurations
      responses:
        '200': {description: Python projects}
  /api/python/deploy:
    post:
      summary: Deploy Python application
      responses:
        '202': {description: Deploy job queued}
  /api/wordpress/:
    get:
      summary: List WordPress sites
      responses:
        '200': {description: WordPress sites}
  /api/wordpress/status/:
    get:
      summary: Get WordPress site status
      responses:
        '200': {description: WordPress status}
  /api/ftp:
    get:
      summary: FTP service setup status
      responses:
        '200': {description: vsftpd status and safe setup defaults}
  /api/security/audit:
    get:
      summary: Security posture checks
      responses:
        '200': {description: Security checks}
  /api/audit/events:
    get:
      summary: Query verified audit and deployment history
      parameters:
        - {name: target, in: query, schema: {type: string}, description: Exact case-insensitive target filter}
        - {name: action, in: query, schema: {type: string}, description: Exact case-insensitive action filter}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        '200': {description: Bounded events with verified, empty, or unconfigured integrity state}
        '503': {description: Audit-chain integrity verification failed}
  /api/cloud:
    get:
      summary: Read cloud server, DNS, load balancer, and snapshot inventory
      responses:
        '200': {description: Cloud inventory}
  /api/cloud/action:
    post:
      summary: Start, stop, reboot, or snapshot an existing cloud resource
      description: Linode snapshot requests require snapshot_label and confirm_snapshot_replacement=true because the provider may replace the current manual snapshot. Optional Idempotency-Key values deduplicate the exact request for 24 hours from admission, including across UTC midnight, and for longer if the job is still active; distinct submissions without a key always create distinct attempts.
      parameters:
        - {name: Idempotency-Key, in: header, required: false, schema: {type: string, minLength: 1, maxLength: 128}}
      responses:
        '202': {description: Provider action queued; poll the returned job URL}
        '409': {description: Idempotency key was already used for a different request}
  /api/cloud/dns:
    get:
      summary: List Linode DNS records
      responses:
        '200': {description: DNS records}
    post:
      summary: Queue a Linode DNS record creation or update
      description: MX requests provide target and priority separately. SRV requests provide service, protocol, target, port, priority, and weight as separate fields. A matching create is considered already present only when its TTL and type-specific fields also match.
      parameters:
        - {name: Idempotency-Key, in: header, required: false, schema: {type: string, minLength: 1, maxLength: 128}}
      responses:
        '202': {description: DNS change queued}
        '409': {description: Idempotency key was already used for a different request}
    delete:
      summary: Queue a Linode DNS record deletion
      responses:
        '202': {description: DNS change queued}
  /api/dns/capabilities:
    get:
      summary: Report the provider-neutral DNS adapter contract
      responses:
        '200': {description: Configured adapter, supported adapters, and DNSSEC status}
  /api/cloud/loadbalancer:
    post:
      summary: Queue a Linode load-balancer backend add or removal
      description: Node additions accept address as an IP and port separately, then combine them into the provider's address-with-port field (IPv6 is bracketed). A label is required and weight must be from 1 through 255. Optional Idempotency-Key values deduplicate an exact request for 24 hours from admission, including across UTC midnight, and for longer if the job is still active.
      parameters:
        - {name: Idempotency-Key, in: header, required: false, schema: {type: string, minLength: 1, maxLength: 128}}
      responses:
        '202': {description: Load-balancer change queued}
        '409': {description: Idempotency key was already used for a different request}
  /api/cloud/snapshots:
    get:
      summary: List backups for one Linode instance (read-only)
      description: Linode backup inventory is instance-scoped. Snapshot deletion is not exposed because the documented API does not provide the assumed account-wide deletion operation.
      parameters:
        - {name: linode_id, in: query, required: true, schema: {type: string, pattern: '^[0-9]{1,12}$'}}
      responses:
        '200': {description: Automatic and manual backup information for the selected Linode instance}
        '422': {description: Missing or invalid Linode instance ID}
  /api/ssh:
    get:
      summary: Inspect configured SSH servers with strict host-key checking
      responses:
        '200': {description: Reachability, OS, failed units, and root filesystem status}
  /api/ssh/action:
    post:
      summary: Queue an allowlisted SSH service restart or reboot
      responses:
        '202': {description: SSH action queued; poll the returned job URL}
  /api/capabilities:
    get:
      summary: Report host capabilities (administrator only)
      security:
        - sessionCookie: []
        - bearerToken: []
      description: Requires an administrator session or an administrator API token with admin:read. Capability modes include unsupported, configured, locally_validated, remote_verified, available, degraded, partial, and manual. Only available sets the legacy available boolean. Configuration or local checks do not prove remote service access or a specific restore artifact.
      responses:
        '200':
          description: Host capability evidence returned to an authenticated administrator
          content:
            application/json:
              schema:
                type: object
                required: [version, hostname, capabilities]
                properties:
                  version: {type: string}
                  hostname: {type: string}
                  capabilities:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/Capability'
        '401': {description: Authentication required}
        '403': {description: Administrator access required}
  /api/accounts:
    get:
      summary: List shared-hosting customer accounts and plan limits (administrator only)
      responses:
        '200': {description: Customer account metadata without password hashes or TOTP secrets}
        '403': {description: Administrator access required}
    post:
      summary: Create a shared-hosting customer account with explicit site assignments (administrator only)
      responses:
        '201': {description: Customer account created without password or TOTP secret disclosure}
        '422': {description: Invalid plan, assigned sites, password, or TOTP seed}
  /api/accounts/:
    patch:
      summary: Update account plan/assignments or suspend account
      responses:
        '200': {description: Account updated}
    delete:
      summary: Remove a customer login
      responses:
        '204': {description: Customer login removed}
  /api/account/password:
    post:
      summary: Complete the authenticated customer's required password change
      responses:
        '204': {description: Password changed and session revoked}
  /api/account/mfa:
    post:
      summary: Complete the authenticated customer's required MFA enrollment
      responses:
        '204': {description: TOTP enrollment saved and session revoked}
  /api/account/security:
    get:
      summary: Customer security center
      responses:
        '200': {description: Security settings and controls}
  /api/account/me:
    get:
      summary: Return the authenticated customer's tenant-scoped plan, usage, and account status
      responses:
        '200': {description: Customer account view without credentials or recovery secrets}
  /api/account/members:
    get:
      summary: List members of the authenticated customer tenant (owner only)
      responses:
        '200': {description: Tenant member metadata without credentials or MFA secrets}
    post:
      summary: Add a role-scoped member login to the authenticated customer tenant (owner only)
      responses:
        '201': {description: Tenant member created without password or TOTP secret disclosure}
        '422': {description: Invalid member identity, role, password, or MFA seed}
  /api/account/members/:
    patch:
      summary: Change a tenant member role or suspension state (owner only)
      responses:
        '200': {description: Tenant member updated}
    delete:
      summary: Remove a tenant member login (owner only)
      responses:
        '204': {description: Tenant member removed and credentials revoked}
  /api/account/activity:
    get:
      summary: Return verified activity scoped to the authenticated customer's tenant
      responses:
        '200': {description: Tenant-scoped audit activity}
  /api/account/sessions/revoke:
    post:
      summary: Log out every other session for the authenticated customer, keeping the current one active
      responses:
        '204': {description: Other sessions revoked; the calling session remains valid}
  /api/account/tokens:
    get:
      summary: List the authenticated customer's API token metadata
      responses:
        '200': {description: Token metadata without secrets}
    post:
      summary: Create a customer-scoped API token; the secret is returned once
      responses:
        '201': {description: Token secret and metadata}
  /api/account/tokens/:
    delete:
      summary: Revoke one customer API token
      responses:
        '204': {description: Token revoked}
  /api/admin/tokens:
    get:
      summary: List administrator API token metadata
      description: Browser administrator session only; bearer tokens cannot manage credentials.
      responses:
        '200': {description: Administrator token metadata}
    post:
      summary: Create a scoped administrator API token; the secret is returned once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: {type: string, minLength: 1, maxLength: 80}
                expires_at: {type: integer, format: int64}
                scopes:
                  type: array
                  minItems: 1
                  items: {type: string, enum: [admin:read, admin:operate]}
      responses:
        '201': {description: Token secret and metadata}
  /api/admin/tokens/:
    delete:
      summary: Revoke one administrator API token
      responses:
        '204': {description: Token revoked}
  /api/admin/suspend:
    post:
      summary: Suspend a customer account
      responses:
        '200': {description: Account suspended}
  /api/admin/unsuspend:
    post:
      summary: Unsuspend a customer account
      responses:
        '200': {description: Account unsuspended}
  /api/admin/plan-status:
    get:
      summary: Check resource plan enforcement status
      responses:
        '200': {description: Plan enforcement status}
  /api/admin/migration-doctor:
    post:
      summary: Analyze source server for migration compatibility
      responses:
        '200': {description: Migration analysis results}
  /api/admin/migration-doctor/status:
    get:
      summary: Check migration analysis status
      responses:
        '200': {description: Analysis status}
  /api/admin/production-readiness:
    get:
      summary: Check production readiness status
      description: Check if the deployment meets production requirements including filesystem quotas, encryption keys, TLS, and offsite backups
      responses:
        '200': {description: Production readiness report with status of each requirement}
  /api/admin/support-bundle:
    get:
      summary: Download a redacted operational support bundle
      description: Administrator-only streamed ZIP containing runtime metadata, readiness, production checks, metrics, and non-secret job summaries. Credentials, keys, payloads, outputs, database contents, and raw customer logs are excluded.
      responses:
        '200': {description: Redacted support bundle ZIP archive}
  /api/admin/resources/status:
    get:
      summary: Host resource allocation and utilization
      description: Report current workload class utilization to prevent host I/O bottlenecks. Shows active concurrent operations per workload type (uploads, backups, extractions, malware scans, builds, database restores).
      responses:
        '200': {description: Resource budget status with per-workload-class utilization}
  /api/security/scan:
    post:
      summary: Scan a managed site for suspicious PHP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site]
              properties:
                site: {type: string}
                quarantine: {type: boolean}
      responses:
        '200': {description: Scan results}
  /api/certificates/issue:
    post:
      summary: Queue a Let’s Encrypt certificate request after preview confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain, email, preview_token]
              properties:
                domain: {type: string, format: hostname}
                email: {type: string, format: email}
                preview_token: {type: string}
      responses:
        '202': {description: Certificate job queued}
        '409': {description: Preview expired or certificate lineage changed}
  /api/certificates/preview:
    post:
      summary: Preview certificate issuance effects and recovery steps
      responses:
        '200': {description: Current lineage, proposed operation, expiry, and recovery plan}
  /api/sites:
    get:
      summary: List managed PHP site routes or the authenticated tenant's assigned sites
      responses:
        '200': {description: Managed site vhost names}
    post:
      summary: Create a site from a template
      description: >
        An administrator or active tenant owner may use this endpoint. It
        queues a durable site.create job that writes the
        template into SiteManager staging, creates the site's system account
        and PHP-FPM pool through the root broker, activates the tree and seals
        its ownership. Tenant-owner requests assign the site to the account
        under its plan before queueing. The wordpress template additionally
        requires a managed MySQL/MariaDB helper, WP-CLI, a backup root, and a
        domain; it installs WordPress with a dedicated database identity,
        managed HTTPS, baseline hardening, an integrity-verified database
        backup, and a daily backup schedule. Archive integrity does not claim
        an application-level recovery rehearsal. A failed or interrupted
        creation removes everything it created. Accepts an optional
        Idempotency-Key header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site]
              properties:
                site: {type: string, pattern: '^[a-z0-9_-]{1,32}$'}
                template: {type: string, enum: [php, wordpress], default: php}
                domain: {type: string, format: hostname, description: Required for WordPress}
                title: {type: string, maxLength: 150, description: Required for WordPress}
                admin_user: {type: string, maxLength: 60, description: Required for WordPress}
                admin_email: {type: string, format: email, description: Required for WordPress}
                admin_password: {type: string, minLength: 20, maxLength: 128, writeOnly: true, description: Required for WordPress; carried encrypted in the durable job payload}
      responses:
        '202': {description: Creation job queued, with job_id and status_url}
        '403': {description: Authentication, tenant authorization, or CSRF requirement failed}
        '409': {description: Site already exists}
        '422': {description: Invalid site name or unsupported template}
  /api/sites/overview:
    get:
      summary: List site-centric developer workspaces
      responses:
        '200': {description: Sites with document roots, routes, applications, and managed database counts}
  /api/sites/overview/:
    get:
      summary: Inspect one site-centric developer workspace
      responses:
        '200': {description: Site workspace details}
        '404': {description: Site not found}
  /api/sites/recovery/:
    get:
      summary: Recovery status for one site, from backups, offsite copies, and restore rehearsals
      description: >
        Path is /api/sites/recovery/{site}. Requires backup:read. Confidence is
        verified, degraded, failing, unverified, or no_backup, with the reasons
        that lowered it. Each rehearsal states the level it proved; the archive
        level does not include database import or application start.
      responses:
        '200': {description: Recovery status with the last ten rehearsals}
        '403': {description: Site is not assigned to this account}
        '422': {description: Invalid site}
        '503': {description: Recovery history is unavailable}
  /api/sites/deploy:
    post:
      summary: Preview a domain route change or apply it with its preview token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site, domain]
              properties:
                site: {type: string, pattern: '^[a-z0-9_-]{1,32}$'}
                domain: {type: string, format: hostname}
                preview_token: {type: string, description: Required to apply a prior preview}
      responses:
        '200': {description: Change preview with observed state, effects, recovery plan, and expiring token}
        '202': {description: Vhost validated, activated, and web server reloaded}
        '409': {description: Preview expired or the route state changed}
        '422': {description: Invalid route or missing site document root}
        '503': {description: Host validation or web server reload failed}
  /api/sites/route-delete-preview:
    post:
      summary: Preview removal of a managed domain route
      responses:
        '200': {description: Current vhost state, effects, recovery plan, and expiring token}
        '409': {description: Route has no durable ownership record}
  /api/sites/environment/:
    get:
      summary: Read site environment metadata with secrets masked
      responses:
        '200': {description: Environment metadata}
    put:
      summary: Replace site environment variables
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: {type: object}}}}
      responses: {'204': {description: Environment saved}}
    delete:
      summary: Delete all site environment variables
      responses: {'204': {description: Environment deleted}}
  /api/sites/php/:
    get:
      summary: Inspect a site PHP runtime profile and installed versions
      responses: {'200': {description: Runtime profile and capability inventory}}
    put:
      summary: Apply a validated per-site PHP-FPM profile with a preview token
      responses:
        '202': {description: FPM profile validated and applied}
        '409': {description: Preview missing, expired, or stale}
    post:
      summary: Preview a per-site PHP-FPM profile change and recovery plan
      responses: {'200': {description: Current and proposed profiles with expiring token}}
  /api/sites/redis/:
    get:
      summary: List Redis allocations
      responses: {'200': {description: Redis metadata}}
  /api/sites/resources/:
    get:
      summary: Inspect a per-site resource profile and its enforcement scope
      responses: {'200': {description: Desired/applied resource profile}}
    put:
      summary: Apply CPU, memory, I/O, task and PHP-FPM worker ceilings for a site
      responses: {'202': {description: Systemd slice and FPM profile applied}}
  /api/reconcile/resources:
    post:
      summary: Reconcile pending/inactive desired resource profiles with systemd and PHP-FPM
      responses: {'200': {description: Reconciled and failed site lists}}
  /api/reconcile/tasks:
    post:
      summary: Reconcile pending or deleted scheduled-task desired state with systemd
      responses: {'200': {description: Reconciled and failed task lists}}
  /api/sites/usage/:
    get:
      summary: Measure bounded regular-file usage for a site without following symlinks
      responses: {'200': {description: Bytes, file count, directory count and completeness}}
  /api/sites/diagnostics/:
    get:
      summary: Correlate site-scoped database, filesystem, quota and TLS evidence
      description: Read-only diagnostic snapshot; database names require database:read, and local certificate metadata does not prove a live TLS handshake or application database login.
      responses: {'200': {description: Site diagnostics with explicit unavailable and unverified states}}
  /api/account/hosting:
    get:
      summary: Read the caller's hosting account, its Unix user and home, and each accessible site's placement and document root
      responses: {'200': {description: Account, Unix user, home directory and sites (main site first)}, '403': {description: Not a customer account}}
  /api/sites/files/:
    get:
      summary: List a directory or read a file inside a hosting-account site's document root
      description: "GET /api/sites/files/{site}?path=P lists a directory (files:read). GET /api/sites/files/{site}/content?path=P returns a file of at most 2 MiB as JSON, or as an attachment with download=1. Paths are relative to the document root; '..', empty and '.' components, control characters and symbolic links are refused. Legacy sites outside a hosting account answer 409."
      responses: {'200': {description: Directory listing or file content}, '404': {description: Path does not exist}, '409': {description: Site is not in a hosting account}}
    put:
      summary: Atomically replace a file inside a hosting-account site's document root
      description: "PUT /api/sites/files/{site}/content?path=P with the raw file bytes (at most 4 MiB; files:write). An existing file keeps its permissions. Runs as the account's Unix user under the site mutation lease with a security audit record."
      responses: {'200': {description: File written}, '413': {description: Content too large}, '422': {description: Refused, with the reason}}
    post:
      summary: Create a directory, rename or delete inside a hosting-account site's document root
      description: "POST /api/sites/files/{site}/mkdir {path}, /rename {path, destination} (never replaces an existing destination) and /delete {path} (recursive; a symbolic link is removed, never followed). Requires files:write."
      responses: {'200': {description: Change applied}, '422': {description: Refused, with the reason}}
  /api/security/center:
    get:
      summary: Read administrator host security and operational posture
      responses: {'200': {description: Existing security checks, webserver-specific WAF capability, service states, disk/inode and backup posture}}
  /api/backups/restore-to-staging:
    post:
      summary: Restore verified backup files into a new isolated staging site
      description: Refuses existing destinations and can optionally provision a new explicitly named managed database and import one selected verified dump. Existing destination databases are refused and a failed import is cleaned up.
      responses: {'202': {description: Files restored and staging route activated}}
  /api/backups/verify:
    post:
      summary: Verify a backup archive and optional authenticated manifest
      description: Performs archive, entry, checksum, and manifest-signature checks without extracting or changing host state.
      responses: {'200': {description: Verified backup and consistency classification}}
  /api/backups/rehearse:
    post:
      summary: Queue a disposable restore rehearsal
      description: Verifies the signed backup, extracts it into a temporary isolated directory, validates the site tree and database dumps, then removes the temporary directory. It never activates a site or imports a database.
      responses: {'202': {description: Restore rehearsal job queued}}
  /api/backups/restore-files:
    post:
      summary: Queue an administrator-only verified files-only site restore
      description: Verifies the archive and optional manifest signature, then atomically replaces site files through the recovery journal. Databases are preserved.
      responses: {'202': {description: Restore job queued}}
  /api/backups/restore-database:
    post:
      summary: Queue an administrator-only verified database restore
      description: Creates a verified safety backup, then imports the selected dump into an existing managed database registered to the site. Schema rollback remains manual.
      responses: {'202': {description: Database restore job queued}}
  /api/backups/restore-offsite-files:
    post:
      summary: Queue an administrator-only verified off-site files restore
      description: Retrieves only the fixed backup objects for the configured rclone site/backup layout, verifies them, and atomically restores files while preserving databases.
      responses: {'202': {description: Off-site restore job queued}}
  /api/backups/restore-offsite-database:
    post:
      summary: Queue an administrator-only verified off-site database restore
      description: Retrieves fixed remote backup objects, creates a local safety backup, and imports the selected dump into an existing managed database. Schema rollback remains manual.
      responses: {'202': {description: Off-site database restore job queued}}
  /api/backups/restore-offsite-to-staging:
    post:
      summary: Restore a verified off-site backup into a new staging site
      description: Downloads only the fixed provider-layout objects, verifies the archive and signature, enforces source-site ownership, and uses the recovery-journaled staging flow. Existing destinations are refused; an optional selected dump is imported into a newly provisioned managed staging database.
      responses: {'202': {description: Verified off-site staging restore accepted}}
  /api/runner/build:
    post:
      summary: Execute a validated build definition in the rootless Podman runner
      responses: {'202': {description: Build completed with artifact output}}
  /api/deployments:
    get:
      summary: List durable sandbox-build and atomic-release activation records
      parameters: [{name: site, in: query, required: false, schema: {type: string}}]
      responses: {'200': {description: Site-scoped deployment records}}
  /api/deployments/run:
    post:
      summary: Run a preview sandbox-build-to-atomic-activation release pipeline
      description: Checks out source outside the live document root, optionally creates a verified backup, requires the runner to write a complete /artifact tree, validates it, and atomically activates it. Database migrations and post-activation health checks are intentionally not yet automated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site, repository, image, commands]
              properties:
                site: {type: string}
                repository: {type: string}
                ref: {type: string, default: main}
                image: {type: string}
                commands: {type: array, items: {type: string}, maxItems: 16}
                backup_before_activate: {type: boolean, default: false}
      responses: {'202': {description: Built release atomically activated}}
  /api/staging:
    post:
      summary: Create a recovery-journaled staging site from safe file copies
      description: Staging routes use no-index by default. WordPress file clones require an independently managed staging database, Basic Auth, and noindex; the staging URL and database settings are rewritten, and a managed origin record enables guarded promotion. On Caddy or Apache, set basic_auth with auth_user and auth_password to enable helper-managed Basic Auth; the plaintext password is never persisted. OpenLiteSpeed staging rejects Basic Auth. Database cloning validates source ownership and imports into a new database.
      responses: {'202': {description: Staging site created}}
  /api/staging/promote/preview:
    post:
      summary: Preview promotion of a managed WordPress staging clone
      description: Requires access to both sites and site:deploy. Verifies the recorded clone relationship, active routes, and managed database ownership, then returns a short-lived preview token bound to the observed state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, site]
              properties:
                source: {type: string, description: Staging site}
                site: {type: string, description: Production site}
      responses:
        '200': {description: Proposed file/database changes, safety backup, and recovery plan}
        '409': {description: Staging relationship or current site state is invalid}
  /api/staging/promote:
    post:
      summary: Queue guarded WordPress staging promotion
      description: Requires a current preview token. Creates a verified production safety backup, imports staging data into a new production-owned database, activates files under maintenance mode, rewrites WordPress URLs, checks database integrity, and retains the former production database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, site, preview_token]
              properties:
                source: {type: string, description: Staging site}
                site: {type: string, description: Production site}
                preview_token: {type: string}
      responses:
        '202': {description: Durable promotion job queued}
        '409': {description: Preview expired or site state changed}
        '503': {description: Safety backup or required managed service unavailable}
  /api/tasks/:
    get:
      summary: List bounded systemd-timer scheduled tasks for a site
      description: Returns the effective timer state and bounded execution history for each task.
      responses: {'200': {description: Scheduled task definitions}}
    put:
      summary: Create or replace a site-identity scheduled task
      description: Enforces a minimum recurrence interval, one concurrent run, runtime and CPU/memory/process limits, missed-run policy, and optional HTTPS completion webhook. Ten consecutive failures disable the timer.
      responses: {'202': {description: Systemd service and timer applied}}
    delete:
      summary: Remove a scheduled task service and timer
      responses: {'204': {description: Scheduled task removed}}
  /api/tasks/{site}/{name}/kill:
    post:
      summary: Stop the active run of a scheduled task
      description: Sends SIGTERM to all processes in the task service; systemd force-kills remaining processes after the configured stop grace period.
      responses: {'202': {description: Stop requested}}
  /api/sites/logs/:
    get:
      summary: Read bounded, filtered site logs from allowlisted sources
      responses: {'200': {description: Log lines or downloadable text}}
  /api/sites/access/:
    get:
      summary: Inspect site SSH/SFTP policy and public-key fingerprints
      responses: {'200': {description: Access policy and application state; private keys are never returned}}
    patch:
      summary: Apply site SSH/SFTP shell policy
      responses:
        '200': {description: Access policy applied}
        '502': {description: Desired policy persisted and is pending helper reconciliation}
    post:
      summary: Add a validated SSH public key and apply the site access policy
      responses:
        '201': {description: SSH key added and access policy applied}
        '502': {description: Desired key persisted and is pending helper reconciliation}
    delete:
      summary: Revoke a site SSH public key
      responses:
        '204': {description: SSH key revoked}
        '502': {description: Desired revocation persisted and is pending helper reconciliation}
  /api/workers/:
    get:
      summary: List managed background workers for a site
      responses: {'200': {description: Worker definitions}}
  /api/sites/git-deploy:
    post:
      summary: Checkout and atomically activate a Git release
      description: The repository hostname must be present in STEPANEL_GIT_ALLOWED_HOSTS. Public HTTPS URLs and private git@host:path.git URLs authenticated by a per-site deploy key are accepted. Symlinks and non-regular files are rejected, Git metadata is removed, and repository build scripts are not executed. Use a separately sandboxed build runner for source builds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site, repository]
              properties:
                site: {type: string, pattern: '^[a-z0-9_-]{1,32}$'}
                repository: {type: string, description: 'https://host/path.git or git@host:path.git'}
                ref: {type: string, default: main}
      responses:
        '202': {description: Release activated and previous site release preserved}
        '422': {description: Invalid site, repository, or ref}
        '502': {description: Git checkout or commit identification failed}
  /api/sites/git-key/:
    get:
      summary: Inspect whether a site deploy key is configured and return its public key
      responses: {'200': {description: Deploy-key metadata; no private key material is ever returned}}
    post:
      summary: Generate a root-owned ED25519 deploy key and return only its public half
      responses: {'201': {description: Public deploy key generated}}
    delete:
      summary: Retire a site deploy key
      responses: {'204': {description: Deploy key retired}}
  /api/sites/git-webhook/:
    post:
      summary: Deploy a signed Git webhook payload
      parameters:
        - {name: X-StePanel-Signature, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site, repository]
              properties:
                site: {type: string}
                repository: {type: string, format: uri}
                ref: {type: string}
      responses:
        '202': {description: Deployment accepted}
        '401': {description: Invalid signature}
  /api/admin/webhooks/:
    post:
      summary: Create or replace a per-site signed webhook authorization
      description: The site is the path suffix. A generated secret is returned once when the request omits secret. At least one repository and one ref allowlist entry are required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repositories, allowed_refs]
              properties:
                secret: {type: string, minLength: 32, writeOnly: true}
                repositories: {type: array, minItems: 1, items: {type: string, format: uri}}
                allowed_refs: {type: array, minItems: 1, items: {type: string}}
      responses:
        '201': {description: Webhook authorization persisted; secret is returned in this response only}
        '422': {description: Invalid site, secret, repository, or ref pattern}
    put:
      summary: Replace a per-site signed webhook authorization
      responses:
        '201': {description: Webhook authorization persisted}
    delete:
      summary: Disable a site's signed webhook authorization
      responses:
        '204': {description: Webhook authorization disabled}
  /api/sites/git-rollback/preview:
    get:
      summary: Preview the current-to-previous Git release swap
      description: Administrator-only. The returned preview token must be submitted with the rollback request and is checked again under the site mutation lock.
      responses:
        '200': {description: Release identities, file counts and sizes, document-root change, service effect, and preview token}
        '409': {description: A safe rollback preview could not be produced}
  /api/sites/git-rollback:
    post:
      summary: Atomically restore the latest preserved Git site release
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site, confirm, preview_token]
              properties:
                site: {type: string, pattern: '^[a-z0-9_-]{1,32}$'}
                confirm: {type: string, description: 'Must equal ROLLBACK followed by the site name'}
                preview_token: {type: string, description: Token from the current Git rollback preview}
      responses:
        '200': {description: Previous release activated and replaced release preserved}
        '409': {description: No valid previous release is available}
  /api/sites/:
    delete:
      summary: Remove a managed PHP site route using its current preview token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preview_token]
              properties:
                preview_token: {type: string}
      responses:
        '200': {description: Vhost removed, web server reloaded, and prior config snapshot retained}
        '404': {description: Managed route not found}
  /api/sites/domains/claim:
    post:
      summary: Create or return the DNS TXT claim needed for customer route activation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site, domain]
              properties:
                site: {type: string, pattern: '^[a-z0-9_-]{1,32}$'}
                domain: {type: string, format: hostname}
      responses:
        '201': {description: TXT record name and value to publish}
        '403': {description: Site is not assigned to the authenticated customer}
        '409': {description: Domain is already claimed by another site}
  /api/sites/domains/verify:
    post:
      summary: Verify the customer DNS TXT claim for a domain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site, domain]
              properties:
                site: {type: string, pattern: '^[a-z0-9_-]{1,32}$'}
                domain: {type: string, format: hostname}
      responses:
        '200': {description: Domain ownership verified}
        '409': {description: TXT record is missing or does not match}
  /api/sites/terminate:
    post:
      summary: Queue a confirmed administrator site termination
      description: Creates and verifies a retained backup, removes managed databases, routes, application services, SSH/PHP/quota state, durable site state, and tenant ownership. The confirmation must exactly match DELETE plus the site name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site, confirmation]
              properties:
                site: {type: string, pattern: '^[a-z0-9_-]{1,32}$'}
                confirmation: {type: string, example: 'DELETE example'}
                dry_run: {type: boolean, description: Return the validated change plan without queueing termination}
      responses:
        '202': {description: Durable termination job queued}
        '200': {description: Deterministic termination plan returned when dry_run is true}
        '404': {description: Site document root not found}
        '503': {description: Termination cannot proceed because a required helper or backup is unavailable}
  /api/backups:
    get:
      summary: List published site backup summaries
      responses:
        '200': {description: Backup paths, checksums, sizes, databases, and verification times}
    post:
      summary: Queue a verified site backup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site]
              properties:
                site: {type: string, pattern: '^[a-z0-9_-]{1,32}$'}
                include_databases: {type: boolean, default: false}
      responses:
        '202': {description: Backup job queued}
  /api/backup-schedules:
    get:
      summary: List scheduled site backups
      responses:
        '200': {description: Schedules with retention, last success, error, duration, and consecutive failures}
    put:
      summary: Create or replace a site backup schedule
      responses:
        '200': {description: Schedule saved}
    delete:
      summary: Delete a site backup schedule
      responses:
        '204': {description: Schedule deleted}
        '422': {description: Invalid site or unavailable managed-database helper}
        '429': {description: Site already has an active restore or backup job}
  /api/cpmove/inspect:
    post:
      summary: Inspect a cPanel backup archive
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [backup]
              properties:
                backup: {type: string, format: binary}
      responses:
        '200': {description: Archive inventory}
        '408': {description: Upload stalled (no body bytes for 2 minutes)}
        '411': {description: No Content-Length and no configured upload ceiling to admit against}
        '413': {description: Archive exceeds STEPANEL_MAX_UPLOAD_BYTES}
        '507': {description: Insufficient free space for the archive, extraction, staging, and reserve after outstanding upload reservations}
  /api/cpmove/import:
    post:
      summary: Queue a cPanel restore
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$'}
          description: Reuse to return the existing restore job for safe client retries
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [upload_id, username, confirm]
              properties:
                upload_id: {type: string}
                username: {type: string}
                confirm: {type: string, example: IMPORT}
                restore_databases: {type: string}
      responses:
        '202': {description: Restore job queued}
  /api/wpress/preflight:
    get:
      summary: Check WordPress restore dependencies
      responses:
        '200': {description: wpress-extract, WP-CLI, and database client availability}
  /api/wpress/import:
    post:
      summary: Queue an All-in-One WP Migration restore
      description: Every form field must precede the backup file part; fields are validated before any archive byte is accepted.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [backup, site, db_name, db_user, db_password, confirm]
              properties:
                backup: {type: string, format: binary}
                site: {type: string}
                db_name: {type: string, pattern: '^[a-z0-9_]{1,40}$'}
                db_user: {type: string, pattern: '^[a-z0-9_]{1,40}$'}
                db_password: {type: string, format: password, minLength: 16, maxLength: 128}
                site_url: {type: string, format: uri}
                table_prefix: {type: string, default: wp_}
                overwrite: {type: string}
                confirm: {type: string, example: WPRESTORE}
      responses:
        '202': {description: WordPress restore job queued}
        '400': {description: Missing confirmation, fields after the file part, or not a .wpress archive}
        '408': {description: Upload stalled (no body bytes for 2 minutes)}
        '411': {description: No Content-Length and no configured upload ceiling to admit against}
        '413': {description: Archive exceeds STEPANEL_MAX_UPLOAD_BYTES}
        '507': {description: Insufficient free space for the archive, extraction, staging, and reserve}
  /api/jobs:
    get:
      summary: List recent persistent jobs
      responses:
        '200': {description: Up to 100 jobs, newest first}
  /api/jobs/events:
    get:
      summary: Stream persistent job changes
      description: Authenticated server-sent events stream with an initial job snapshot and subsequent durable state changes. A comment heartbeat is sent every 25 seconds and the credential is re-checked at each heartbeat; the server closes the stream after 25-30 minutes, when a write stalls, or when the credential is revoked, and clients should reconnect with backoff.
      responses:
        '200': {description: text/event-stream job snapshot and updates}
        '401': {description: Authentication required}
        '429': {description: Too many open streams (8 per principal, 256 per host); honor Retry-After}
  /api/jobs/:
    get:
      summary: Read a background job
      responses:
        '200': {description: Job state}
        '404': {description: Job not found}
    post:
      summary: Request cancellation of a background job or requeue a dead-letter job
      responses:
        '202': {description: Cancellation requested or job requeued}
        '403': {description: Administrator authentication and CSRF validation required}
        '409': {description: Job is no longer cancellable or not a dead-letter record}
  /api/admin/archive/inspect:
    post:
      summary: Inspect archive for migration requirements
      description: Analyzes an archive without importing it. Returns site type, PHP version, database requirements, and any issues.
      responses:
        '200': {description: Archive inspection results}
        '400': {description: Invalid archive or URL}
        '403': {description: Administrator authentication required}
  /api/admin/archive/inspect/status:
    get:
      summary: Check archive inspection job status
      parameters:
        - {name: job_id, in: query, required: false, schema: {type: string}}
      responses:
        '200': {description: Inspection status and results}
        '404': {description: Job not found}
  /api/admin/archive/import:
    post:
      summary: Queue an archive import
      description: "Begins importing a website from an archive into a new site in a hosting account. Body: url, config_path, site_name, and optional account (defaults to the site name), kind (main, addon or subdomain) and domain, database_password and auto_restore_db. Files are extracted and the database is located."
      responses:
        '202': {description: Import job queued}
        '400': {description: Invalid archive or requirements}
        '422': {description: The hosting-account placement is invalid}
        '403': {description: Administrator authentication required}
  /api/admin/archive/import/status:
    get:
      summary: Check archive import job status
      parameters:
        - {name: job_id, in: query, required: false, schema: {type: string}}
      responses:
        '200': {description: Import status and progress}
        '404': {description: Job not found}
components:
  schemas:
    Error:
      type: object
      description: Envelope for every /api/ error response. 5xx messages are generic; correlate request_id with the server log.
      required: [error, code]
      properties:
        error: {type: string}
        code: {type: integer}
        request_id: {type: string}
    Capability:
      type: object
      required: [available, mode]
      properties:
        available:
          type: boolean
          description: True only when mode is available; intermediate evidence modes remain false.
        mode:
          type: string
          enum: [unsupported, manual, partial, available, degraded, configured, locally_validated, remote_verified]
        reason: {type: string}
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: stepanel_session
    bearerToken:
      type: http
      scheme: bearer
