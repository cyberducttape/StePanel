groups:
  - name: stepanel-availability
    interval: 30s
    rules:
      - alert: StePanelTargetDown
        expr: up{job="stepanel"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: StePanel target is unavailable
          description: Prometheus cannot scrape the StePanel metrics endpoint for five minutes.

      # The ratio uses the real request rate. With no traffic the division is
      # NaN and the rule is simply not satisfied; it is not clamped, which
      # would understate the ratio on a quiet single-host panel. A minimum
      # sample volume keeps one failed request out of four from paging.
      - alert: StePanelHTTP5xxRateHigh
        expr: |
          (
            sum(rate(stepanel_http_errors_total{job="stepanel"}[5m]))
            /
            sum(rate(stepanel_http_requests_total{job="stepanel"}[5m]))
            > 0.05
          )
          and
          sum(increase(stepanel_http_requests_total{job="stepanel"}[5m])) >= 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: StePanel HTTP error rate is elevated
          description: More than five percent of StePanel requests returned 5xx responses for ten minutes.

      # Below the ratio rule's sample volume, alert on an absolute count, so a
      # low-traffic panel where most requests fail is still noticed.
      - alert: StePanelHTTP5xxLowTraffic
        expr: |
          sum(increase(stepanel_http_errors_total{job="stepanel"}[15m])) >= 3
          and
          sum(increase(stepanel_http_requests_total{job="stepanel"}[5m])) < 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: StePanel is returning server errors at low traffic
          description: At least three StePanel requests returned 5xx responses in fifteen minutes while traffic was too low for the error-rate alert.

      - alert: StePanelSQLiteBusy
        expr: increase(stepanel_sqlite_busy_errors_total{job="stepanel"}[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: StePanel SQLite contention was observed
          description: Durable state paths encountered SQLite busy or locked errors; inspect control-plane contention and worker concurrency.

      - alert: StePanelJobInventoryUnavailable
        expr: stepanel_jobs_inventory_errors{job="stepanel"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: StePanel could not read durable job inventory
          description: Job queue metrics are unavailable; inspect control-plane SQLite health and the panel-worker database connection before trusting job status views.

      - alert: StePanelDeadLetterJobs
        expr: stepanel_jobs_dead_letter{job="stepanel"} > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: StePanel has jobs requiring operator review
          description: One or more durable jobs exhausted retries; inspect the job record and recovery state, then explicitly retry, resolve, or archive it.

      - alert: StePanelQueueWaitTooLong
        expr: stepanel_jobs_queued{job="stepanel"} > 0 and stepanel_jobs_oldest_queued_age_seconds{job="stepanel"} > 900
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: StePanel jobs are waiting unusually long
          description: The oldest durable queued job has waited more than fifteen minutes; inspect worker availability, admission limits, and owner-level queue blocking.

      - alert: StePanelControlPlaneDatabaseNearLimit
        expr: stepanel_control_plane_database_limit_ratio{job="stepanel"} > 0.80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: StePanel control-plane database is nearing its configured limit
          description: SQLite logical page allocation is above 80 percent of the fixed 10 GiB limit; inspect job and outbox retention and plan maintenance before writes are refused.

      - alert: StePanelCapacityLedgerUnavailable
        expr: stepanel_capacity_reservations_up{job="stepanel"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Durable storage admission telemetry is unavailable
          description: The capacity reservation ledger could not be read; verify control-plane SQLite health and that storage-consuming operations are failing closed.

      - alert: StePanelAuditOutboxBacklog
        expr: stepanel_audit_outbox_pending{job="stepanel"} > 0 and stepanel_audit_outbox_oldest_pending_age_seconds{job="stepanel"} > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Durable audit events are not reaching the signed audit log
          description: The oldest unpublished audit event is more than five minutes old; inspect audit-log permissions, disk capacity, and the audit outbox.

      - alert: StePanelNotificationOutboxBacklog
        expr: stepanel_operator_notifications_pending{job="stepanel"} > 0 and stepanel_operator_notifications_oldest_pending_age_seconds{job="stepanel"} > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Operator notifications are accumulating
          description: At least one required alert delivery has remained pending for more than fifteen minutes; inspect destination health and notification outbox metrics.

      - alert: StePanelReadinessCheckFailed
        expr: stepanel_readiness_check_ready{job="stepanel"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: A StePanel readiness check is failing
          description: A durable control-plane readiness check has remained failed for five minutes; inspect /readyz before making changes.

      - alert: StePanelDurableStateError
        expr: |
          sum by (category) (
            increase(stepanel_state_errors_total{job="stepanel",category=~"persistence|corruption"}[10m])
          ) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: StePanel durable state error detected
          description: A persistence or corruption error was recorded; inspect readiness, the audit log, and the recovery spool before replaying work.

      - alert: StePanelTemporaryStateErrors
        expr: increase(stepanel_state_errors_total{job="stepanel",category="temporary"}[10m]) >= 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: StePanel temporary state errors are recurring
          description: At least five retryable state errors occurred in ten minutes; inspect SQLite contention, helper health, and worker capacity.

  - name: stepanel-restore-operations
    interval: 30s
    rules:
      - alert: StePanelRestoreFailures
        expr: increase(stepanel_restore_jobs_failed_total{job="stepanel"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: StePanel restore jobs are failing
          description: At least one restore failed in the last fifteen minutes; inspect the audit log and job error.

      - alert: StePanelRestoreJobsStuck
        expr: stepanel_restore_jobs_active{job="stepanel"} > 0
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: StePanel restore job has been active too long
          description: A restore job has remained active for two hours; inspect worker and storage health.

  - name: stepanel-database-operations
    interval: 30s
    rules:
      - alert: StePanelDatabaseDiagnosticsDown
        expr: stepanel_database_diagnostics_up{job="stepanel"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Database diagnostics are unavailable
          description: The restricted helper could not collect database health for ten minutes; verify the engine, local socket, and helper configuration.

      - alert: StePanelDatabaseSessionsBlocked
        expr: stepanel_database_blocked_sessions{job="stepanel"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Database sessions are blocked
          description: One or more database sessions have remained blocked for five minutes; inspect the session inventory and lock chain with an engine-native client.

      - alert: StePanelDatabaseLongTransactions
        expr: stepanel_database_long_transactions{job="stepanel"} > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Long database transactions detected
          description: Transactions older than five minutes have persisted for ten minutes and may delay vacuum, purge, DDL, or backups.

      - alert: StePanelScheduledBackupFailures
        expr: stepanel_backup_consecutive_failures{job="stepanel"} > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Scheduled backups are failing
          description: A site has one or more consecutive scheduled backup failures; inspect the job, free space, database helper, and offsite target.
