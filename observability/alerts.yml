groups:
  - name: stepanel-availability
    interval: 30s
    rules:
      - alert: StePanelTargetDown
        expr: up{job="stepanel"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: StePanel target is unavailable
          description: Prometheus reports up={{ $value }} for this target, meaning its last scrape failed; the condition persisted for five minutes. Check the panel process, /metrics listener, scrape target, and the Prometheus target error.

      # The ratio uses the real request rate. With no traffic the division is
      # NaN and the rule is simply not satisfied; it is not clamped, which
      # would understate the ratio on a quiet single-host panel. A minimum
      # sample volume keeps one failed request out of four from paging.
      - alert: StePanelHTTP5xxRateHigh
        expr: |
          (
            sum(rate(stepanel_http_errors_total{job="stepanel"}[5m]))
            /
            sum(rate(stepanel_http_requests_total{job="stepanel"}[5m]))
            > 0.05
          )
          and
          sum(increase(stepanel_http_requests_total{job="stepanel"}[5m])) >= 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: StePanel HTTP error rate is elevated
          description: The observed StePanel 5xx request ratio is {{ $value | humanizePercentage }}, above the 5% threshold for ten minutes. Check recent request logs, readiness, and the failing route distribution.

      # Below the ratio rule's sample volume, alert on an absolute count, so a
      # low-traffic panel where most requests fail is still noticed.
      - alert: StePanelHTTP5xxLowTraffic
        expr: |
          sum(increase(stepanel_http_errors_total{job="stepanel"}[15m])) >= 3
          and
          sum(increase(stepanel_http_requests_total{job="stepanel"}[5m])) < 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: StePanel is returning server errors at low traffic
          description: "{{ $value }} StePanel requests returned 5xx responses in fifteen minutes while request volume was below the ratio-alert threshold. Inspect request logs and group failures by route and status."

      - alert: StePanelSQLiteBusy
        expr: increase(stepanel_sqlite_busy_errors_total{job="stepanel"}[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: StePanel SQLite contention was observed
          description: "{{ $value }} SQLite busy or locked error(s) occurred in ten minutes. Inspect transaction duration, panel/worker write contention, and WAL checkpoint activity."

      - alert: StePanelJobInventoryUnavailable
        expr: stepanel_jobs_inventory_errors{job="stepanel"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: StePanel could not read durable job inventory
          description: The durable job inventory reports {{ $value }} read error(s); job status metrics may be incomplete. Check control-plane SQLite health and panel/worker database connectivity before trusting queue views.

      - alert: StePanelDeadLetterJobs
        expr: stepanel_jobs_dead_letter{job="stepanel"} > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: StePanel has jobs requiring operator review
          description: "{{ $value }} durable job(s) exhausted retries and require operator review. Inspect each job's error, affected resource, and recovery state before explicitly retrying, resolving, or archiving it."

      - alert: StePanelQueueWaitTooLong
        expr: stepanel_jobs_oldest_queued_age_seconds{job="stepanel"} > 900 and stepanel_jobs_queued{job="stepanel"} > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: StePanel jobs are waiting unusually long
          description: The oldest durable queued job has waited {{ $value | humanizeDuration }}, above the fifteen-minute threshold, while the alert condition confirms at least one queued job exists. Check worker availability, admission limits, and earlier work blocking the same owner.

      - alert: StePanelControlPlaneDatabaseNearLimit
        expr: stepanel_control_plane_database_limit_ratio{job="stepanel"} > 0.80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: StePanel control-plane database is nearing its configured limit
          description: SQLite logical page allocation is {{ $value | humanizePercentage }} of the configured 10 GiB limit, above the 80% threshold. Review database growth, retained jobs/outboxes, and maintenance capacity before writes are refused.

      - alert: StePanelCapacityLedgerUnavailable
        expr: stepanel_capacity_reservations_up{job="stepanel"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Durable storage admission telemetry is unavailable
          description: The capacity reservation ledger health metric is {{ $value }} (0 means unavailable). Verify control-plane SQLite health and confirm storage-consuming operations are refusing admission when reservations cannot be checked.

      - alert: StePanelFilesystemCapacityUnavailable
        expr: stepanel_host_filesystem_probe_up{job="stepanel"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Filesystem capacity could not be measured for {{ $labels.role }}
          description: "The {{ $labels.role }} filesystem probe reports {{ $value }} (0 means Statfs failed) for five minutes. Check the configured storage path and panel permissions; do not assume the filesystem has free capacity until a fresh measurement succeeds."

      - alert: StePanelFilesystemBytesLow
        expr: |
          (
            stepanel_host_filesystem_available_bytes{job="stepanel"}
            /
            stepanel_host_filesystem_total_bytes{job="stepanel"}
            < 0.10
          )
          and on(role)
          (stepanel_host_filesystem_total_bytes{job="stepanel"} > 0)
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Free disk space is below 10% for {{ $labels.role }} storage
          description: "Only {{ $value | humanizePercentage }} of filesystem bytes remain for the {{ $labels.role }} storage role, below the 10% threshold for ten minutes. Check the filesystem's available/total byte metrics, identify large consumers, and expand or free space using the host runbook before starting imports or restores."

      - alert: StePanelFilesystemInodesLow
        expr: |
          (
            stepanel_host_filesystem_available_inodes{job="stepanel"}
            /
            stepanel_host_filesystem_total_inodes{job="stepanel"}
            < 0.10
          )
          and on(role)
          (stepanel_host_filesystem_total_inodes{job="stepanel"} > 0)
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Free inodes are below 10% for {{ $labels.role }} storage
          description: "Only {{ $value | humanizePercentage }} of filesystem inodes remain for the {{ $labels.role }} storage role, below the 10% threshold for ten minutes. Check the available/total inode metrics and identify directories with excessive file counts; free or expand capacity using the host runbook before making changes."

      - alert: StePanelAuditOutboxBacklog
        expr: stepanel_audit_outbox_oldest_pending_age_seconds{job="stepanel"} > 300 and stepanel_audit_outbox_pending{job="stepanel"} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Durable audit events are not reaching the signed audit log
          description: The oldest unpublished audit event is {{ $value | humanizeDuration }} old, above five minutes. Check signed audit-log permissions, disk/inode capacity, and publication errors in the audit outbox.

      - alert: StePanelNotificationOutboxBacklog
        expr: stepanel_operator_notifications_oldest_pending_age_seconds{job="stepanel"} > 900 and stepanel_operator_notifications_pending{job="stepanel"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Operator notifications are accumulating
          description: A required operator notification has remained pending for {{ $value | humanizeDuration }}, above fifteen minutes. Check the affected channel's destination, retry/error state, and notification outbox.

      - alert: StePanelReadinessCheckFailed
        expr: stepanel_readiness_check_ready{job="stepanel"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: A StePanel readiness check is failing
          description: "Readiness component {{ $labels.check }} reports {{ $value }} (0 means failed) for five minutes. Inspect /readyz for the component's detailed evidence and address that dependency before making changes."

      - alert: StePanelDurableStateError
        expr: |
          sum by (category) (
            increase(stepanel_state_errors_total{job="stepanel",category=~"persistence|corruption"}[10m])
          ) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: StePanel durable state error detected
          description: "{{ $labels.category }} state errors increased by {{ $value }} in ten minutes. Inspect readiness, audit records, and the recovery spool before replaying work."

      - alert: StePanelTemporaryStateErrors
        expr: increase(stepanel_state_errors_total{job="stepanel",category="temporary"}[10m]) >= 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: StePanel temporary state errors are recurring
          description: "{{ $value }} retryable state errors occurred in ten minutes, meeting the five-error threshold. Inspect SQLite contention, helper health, and worker capacity."

  - name: stepanel-restore-operations
    interval: 30s
    rules:
      - alert: StePanelRestoreFailures
        expr: increase(stepanel_restore_jobs_failed_total{job="stepanel"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: StePanel restore jobs are failing
          description: "{{ $value }} restore job failure(s) were recorded in fifteen minutes. Inspect the affected durable job, recovery journal, and audit record before retrying."

      - alert: StePanelRestoreJobsStuck
        expr: stepanel_restore_jobs_active{job="stepanel"} > 0
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: StePanel restore job has been active too long
          description: "{{ $value }} restore job(s) remain active beyond the two-hour threshold. Check worker lease/heartbeat, transfer progress, storage pressure, and recovery state before intervening."

  - name: stepanel-database-operations
    interval: 30s
    rules:
      - alert: StePanelDatabaseDiagnosticsDown
        expr: stepanel_database_diagnostics_up{job="stepanel",reason!="none"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Database diagnostics are unavailable
          description: "The restricted {{ $labels.engine }} diagnostics query failed with reason={{ $labels.reason }} (availability={{ $value }}; 0 means no measurements). Check stepanel_database_diagnostics_sample_timestamp_seconds for the observation time. For connection_refused, check service/listener; for authentication, verify helper credentials/grants; for socket_unavailable or helper_unavailable, inspect the configured socket/package. Raw command output is intentionally withheld."

      - alert: StePanelDatabaseSessionsBlocked
        expr: stepanel_database_blocked_sessions{job="stepanel"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Database sessions are blocked
          description: "{{ $value }} database session(s) are blocked, above zero for five minutes. Inspect session IDs and the blocking lock chain with an engine-native client."

      - alert: StePanelDatabaseLongTransactions
        expr: stepanel_database_long_transactions{job="stepanel"} > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Long database transactions detected
          description: "{{ $value }} database transaction(s) older than five minutes persisted for ten minutes. Inspect transaction age and owner; long transactions can delay purge, DDL, and backups."

  - name: stepanel-site-runtime
    interval: 30s
    rules:
      - alert: StePanelSiteRuntimeInventoryUnavailable
        expr: stepanel_site_runtime_inventory_up{job="stepanel"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Per-site runtime monitoring inventory is incomplete
          description: "The site runtime inventory completeness metric is {{ $value }} (0 means one or more inventory sources failed or the site cap was reached). Check account/resource state reads and the sampler log; some sites may not have PHP-FPM or cgroup alerts."

      - alert: StePanelSiteRuntimeSamplesStale
        expr: time() - stepanel_site_runtime_inventory_sample_timestamp_seconds{job="stepanel"} > 300
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Per-site runtime metrics have not refreshed
          description: "The site runtime inventory sample is {{ $value | humanizeDuration }} old, above the five-minute threshold. Check the panel runtime sampler, root broker, and account/resource inventories before trusting per-site alert coverage."

      - alert: StePanelSiteFPMProbeUnavailable
        expr: |
          (stepanel_site_fpm_probe_up{job="stepanel"} == 0)
          and on(site)
          (stepanel_site_fpm_configured{job="stepanel"} == 1)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: PHP-FPM status is unavailable for {{ $labels.site }}
          description: "The managed PHP-FPM pool probe for {{ $labels.site }} reports {{ $value }} (0 means the broker could not obtain pool counters). Check the sample timestamp, pool socket ownership/status endpoint, and root-broker logs; do not infer that the site is healthy from systemd service state alone."

      - alert: StePanelSiteResourceProbeUnavailable
        expr: |
          (stepanel_site_resource_probe_up{job="stepanel"} == 0)
          and on(site)
          (stepanel_site_resource_configured{job="stepanel"} == 1)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Resource-limit usage is unavailable for {{ $labels.site }}
          description: "The site's systemd resource probe reports {{ $value }} (0 means cgroup status could not be measured). Check the sample timestamp, root-broker/resource helper, and managed slice state; do not infer that site limits are enforced from the desired profile alone."

      - alert: StePanelSiteFPMSaturated
        expr: |
          stepanel_site_fpm_listen_queue{job="stepanel"} > 0
          and on(site, php_version)
          (stepanel_site_fpm_active_workers{job="stepanel"} >= on(site, php_version) stepanel_site_fpm_max_children{job="stepanel"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: PHP-FPM is queuing requests for {{ $labels.site }} (PHP {{ $labels.php_version }})
          description: "{{ $value }} request(s) are queued while active workers have reached max_children for {{ $labels.site }} PHP {{ $labels.php_version }}. Confirm active/max worker, queue, slow-request, and sample-time metrics; inspect slow requests and host memory headroom before changing worker limits."

      - alert: StePanelSiteCgroupMemoryNearLimit
        expr: |
          (
            stepanel_site_resource_memory_current_bytes{job="stepanel"}
            /
            stepanel_site_resource_memory_max_bytes{job="stepanel"}
            > 0.90
          )
          and on(site)
          (
            stepanel_site_resource_memory_current_bytes{job="stepanel"}
            /
            stepanel_site_resource_memory_max_bytes{job="stepanel"}
            < 1
          )
          and on(site)
          (stepanel_site_resource_memory_max_bytes{job="stepanel"} > 0)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Site {{ $labels.site }} is near its enforced cgroup memory limit
          description: "Observed cgroup memory use is {{ $value | humanizePercentage }} of the site's configured memory.max for five minutes. Check current/max byte metrics and the sample timestamp; review workload and host headroom before an operator-approved limit change."

      - alert: StePanelSiteCgroupMemoryLimitReached
        expr: |
          (
            stepanel_site_resource_memory_current_bytes{job="stepanel"}
            /
            stepanel_site_resource_memory_max_bytes{job="stepanel"}
            >= 1
          )
          and on(site)
          (stepanel_site_resource_memory_max_bytes{job="stepanel"} > 0)
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Site {{ $labels.site }} has reached its cgroup memory limit
          description: "Observed cgroup memory use is {{ $value | humanizePercentage }} of memory.max. Check the current/max byte metrics and recent OOM evidence; reduce workload or free host capacity before an operator-approved limit change."

      - alert: StePanelSiteCPUQuotaNearLimit
        expr: |
          (stepanel_site_resource_cpu_quota_utilization_percent{job="stepanel"} > 90)
          and
          (stepanel_site_resource_cpu_quota_utilization_percent{job="stepanel"} < 100)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Site {{ $labels.site }} is using most of its CPU quota
          description: "The site's measured CPU time used {{ printf \"%.1f\" $value }}% of its configured CPU quota over the latest sampling interval, above 90% for five minutes. Compare the CPU utilization and resource sample timestamp metrics; inspect slow PHP requests and job activity before an operator-approved quota change."

      - alert: StePanelSiteCPUQuotaSaturated
        expr: stepanel_site_resource_cpu_quota_utilization_percent{job="stepanel"} >= 100
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Site {{ $labels.site }} reached its CPU quota
          description: "The site's measured CPU time used {{ printf \"%.1f\" $value }}% of its configured CPU quota over the latest sampling interval, at or above the enforced limit for two minutes. Check the resource sample timestamp, PHP-FPM slow requests, and active jobs; reduce workload or review capacity before an operator-approved quota change."

      - alert: StePanelSiteCgroupTasksNearLimit
        expr: |
          (
            stepanel_site_resource_tasks_current{job="stepanel"}
            /
            stepanel_site_resource_tasks_max{job="stepanel"}
            > 0.90
          )
          and on(site)
          (
            stepanel_site_resource_tasks_current{job="stepanel"}
            /
            stepanel_site_resource_tasks_max{job="stepanel"}
            < 1
          )
          and on(site)
          (stepanel_site_resource_tasks_max{job="stepanel"} > 0)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Site {{ $labels.site }} is near its enforced task limit
          description: "Observed cgroup task use is {{ $value | humanizePercentage }} of the site's configured TasksMax for five minutes. Check current/max task metrics and the sample timestamp; inspect process growth and scheduled jobs before changing the limit."

      - alert: StePanelSiteCgroupTasksLimitReached
        expr: |
          (
            stepanel_site_resource_tasks_current{job="stepanel"}
            /
            stepanel_site_resource_tasks_max{job="stepanel"}
            >= 1
          )
          and on(site)
          (stepanel_site_resource_tasks_max{job="stepanel"} > 0)
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Site {{ $labels.site }} has reached its task limit
          description: "Observed cgroup task use is {{ $value | humanizePercentage }} of TasksMax. Check current/max task metrics and recent task creation errors; investigate runaway processes before changing the limit."

  - name: stepanel-backup-recovery
    interval: 30s
    rules:
      - alert: StePanelCertificateRenewalEvidenceUnavailable
        expr: stepanel_certificate_renewal_inventory_up{job="stepanel"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Certificate renewal history is unavailable
          description: "The certificate renewal evidence inventory reports {{ $value }} (0 means durable job or domain state could not be read). Check control-plane SQLite health and the panel job reader; do not treat missing evidence as a successful renewal."

      - alert: StePanelCertificateRenewalFailed
        expr: stepanel_certificate_renewal_latest_job_timestamp_seconds{job="stepanel",state=~"failed|dead-letter"} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Certificate issuance failed for {{ $labels.domain }}
          description: "The latest durable certificate issuance job for {{ $labels.domain }} is {{ $labels.state }}; its recorded start time is Unix timestamp {{ printf \"%.0f\" $value }}. Open that domain's certificate job for the helper error, then verify DNS/HTTP validation, certificate lineage, and web-server reload before retrying."

      - alert: StePanelBackupOverdue
        expr: stepanel_backup_last_success_age_seconds{job="stepanel"} - stepanel_backup_interval_seconds{job="stepanel"} > 3600
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Scheduled backup for {{ $labels.site }} is overdue
          description: The last successful backup for {{ $labels.site }} is {{ $value | humanizeDuration }} beyond its configured interval plus one-hour grace period. Inspect its last success/attempt timestamps and latest backup job error; verify free bytes/inodes and offsite transfer status before retrying.

      - alert: StePanelScheduledBackupFailures
        expr: stepanel_backup_consecutive_failures_by_site{job="stepanel"} > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Scheduled backups are failing for {{ $labels.site }}
          description: "{{ $labels.site }} has {{ $value }} consecutive scheduled backup failure(s). Inspect its latest backup job, free bytes and inodes, database helper, and offsite destination before retrying."

      - alert: StePanelBackupNeverSucceeded
        expr: stepanel_backup_success_present{job="stepanel"} == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: No successful scheduled backup exists for {{ $labels.site }}
          description: "The enabled schedule for {{ $labels.site }} has no recorded successful backup (success-present metric is 0). Check its latest attempt age and job result; create a verified backup and rehearse a restore."

      - alert: StePanelRecoveryProofInventoryDown
        expr: stepanel_recovery_proof_inventory_up{job="stepanel"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Application recovery proof inventory is unavailable
          description: Recovery-proof inventory availability is {{ $value }} (0 means durable proof evidence could not be read). Check control-plane database health and recovery-store migrations.

      - alert: StePanelApplicationRecoveryProofMissing
        expr: stepanel_recovery_rehearsal_max_age_seconds{job="stepanel"} > 0 and on(site) stepanel_recovery_application_proof_present{job="stepanel"} == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: No application-level recovery proof for {{ $labels.site }}
          description: The configured recovery-proof inventory has a rehearsal age for {{ $labels.site }}, but its application-proof-present metric is 0. No passing application-level restore proof is recorded (archive checks alone do not prove startup). Inspect the latest rehearsal result and run a successful application proof.

      - alert: StePanelApplicationRecoveryProofStale
        expr: (stepanel_recovery_application_proof_age_seconds{job="stepanel"} > on(site) stepanel_recovery_rehearsal_max_age_seconds{job="stepanel"}) and on(site) (stepanel_recovery_rehearsal_max_age_seconds{job="stepanel"} > 0)
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Application recovery proof is stale for {{ $labels.site }}
          description: The latest successful application-level restore proof is {{ $value | humanizeDuration }}, older than the configured freshness window. Run a full application recovery rehearsal and inspect its job result.
