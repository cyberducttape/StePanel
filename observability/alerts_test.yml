# promtool unit tests for alerts.yml:
#   promtool test rules observability/alerts_test.yml
rule_files:
  - alerts.yml

evaluation_interval: 30s

tests:
  - interval: 1m
    input_series:
      - series: 'stepanel_control_plane_database_limit_ratio{job="stepanel"}'
        values: '0.90+0x30'
      - series: 'stepanel_capacity_reservations_up{job="stepanel"}'
        values: '0+0x30'
      - series: 'stepanel_audit_outbox_pending{job="stepanel"}'
        values: '1+0x30'
      - series: 'stepanel_audit_outbox_oldest_pending_age_seconds{job="stepanel"}'
        values: '400+0x30'
      - series: 'stepanel_operator_notifications_pending{job="stepanel"}'
        values: '1+0x30'
      - series: 'stepanel_operator_notifications_oldest_pending_age_seconds{job="stepanel"}'
        values: '1000+0x30'
      - series: 'stepanel_jobs_inventory_errors{job="stepanel"}'
        values: '1+0x30'
      - series: 'stepanel_jobs_dead_letter{job="stepanel"}'
        values: '1+0x30'
      - series: 'stepanel_jobs_queued{job="stepanel"}'
        values: '1+0x30'
      - series: 'stepanel_jobs_oldest_queued_age_seconds{job="stepanel"}'
        values: '1000+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: StePanelControlPlaneDatabaseNearLimit
        exp_alerts:
          - exp_labels:
              job: stepanel
              severity: warning
            exp_annotations:
              summary: StePanel control-plane database is nearing its configured limit
              description: SQLite logical page allocation is 90% of the configured 10 GiB limit, above the 80% threshold. Review database growth, retained jobs/outboxes, and maintenance capacity before writes are refused.
      - eval_time: 20m
        alertname: StePanelCapacityLedgerUnavailable
        exp_alerts:
          - exp_labels:
              job: stepanel
              severity: critical
            exp_annotations:
              summary: Durable storage admission telemetry is unavailable
              description: The capacity reservation ledger health metric is 0 (0 means unavailable). Verify control-plane SQLite health and confirm storage-consuming operations are refusing admission when reservations cannot be checked.
      - eval_time: 20m
        alertname: StePanelAuditOutboxBacklog
        exp_alerts:
          - exp_labels:
              job: stepanel
              severity: critical
            exp_annotations:
              summary: Durable audit events are not reaching the signed audit log
              description: The oldest unpublished audit event is 6m 40s old, above five minutes. Check signed audit-log permissions, disk/inode capacity, and publication errors in the audit outbox.
      - eval_time: 20m
        alertname: StePanelNotificationOutboxBacklog
        exp_alerts:
          - exp_labels:
              job: stepanel
              severity: warning
            exp_annotations:
              summary: Operator notifications are accumulating
              description: A required operator notification has remained pending for 16m 40s, above fifteen minutes. Check the affected channel's destination, retry/error state, and notification outbox.
      - eval_time: 20m
        alertname: StePanelJobInventoryUnavailable
        exp_alerts:
          - exp_labels:
              job: stepanel
              severity: warning
            exp_annotations:
              summary: StePanel could not read durable job inventory
              description: The durable job inventory reports 1 read error(s); job status metrics may be incomplete. Check control-plane SQLite health and panel/worker database connectivity before trusting queue views.
      - eval_time: 20m
        alertname: StePanelDeadLetterJobs
        exp_alerts:
          - exp_labels:
              job: stepanel
              severity: critical
            exp_annotations:
              summary: StePanel has jobs requiring operator review
              description: 1 durable job(s) exhausted retries and require operator review. Inspect each job's error, affected resource, and recovery state before explicitly retrying, resolving, or archiving it.
      - eval_time: 20m
        alertname: StePanelQueueWaitTooLong
        exp_alerts:
          - exp_labels:
              job: stepanel
              severity: warning
            exp_annotations:
              summary: StePanel jobs are waiting unusually long
              description: The oldest durable queued job has waited 16m 40s, above the fifteen-minute threshold, while the alert condition confirms at least one queued job exists. Check worker availability, admission limits, and earlier work blocking the same owner.

  # 100 requests per minute with 10 percent failing: the ratio rule fires.
  - interval: 1m
    input_series:
      - series: 'stepanel_http_requests_total{job="stepanel"}'
        values: '0+100x30'
      - series: 'stepanel_http_errors_total{job="stepanel"}'
        values: '0+10x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: StePanelHTTP5xxRateHigh
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: StePanel HTTP error rate is elevated
              description: The observed StePanel 5xx request ratio is 10%, above the 5% threshold for ten minutes. Check recent request logs, readiness, and the failing route distribution.
      - eval_time: 20m
        alertname: StePanelHTTP5xxLowTraffic
        exp_alerts: []

  # Healthy high traffic (1 percent failing) does not fire.
  - interval: 1m
    input_series:
      - series: 'stepanel_http_requests_total{job="stepanel"}'
        values: '0+100x30'
      - series: 'stepanel_http_errors_total{job="stepanel"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: StePanelHTTP5xxRateHigh
        exp_alerts: []

  # The reviewer's case: about 10 requests per five minutes with one in five
  # failing. The old clamped ratio computed ~0.67% and never fired; this is a
  # 20% failure rate and the low-traffic rule fires.
  - interval: 1m
    input_series:
      - series: 'stepanel_http_requests_total{job="stepanel"}'
        values: '0+2x30'
      - series: 'stepanel_http_errors_total{job="stepanel"}'
        values: '0 0 0 0 0 2 2 2 2 2 4 4 4 4 4 6 6 6 6 6 8 8 8 8 8 10 10 10 10 10 12'
    alert_rule_test:
      - eval_time: 25m
        alertname: StePanelHTTP5xxLowTraffic
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: StePanel is returning server errors at low traffic
              description: 6.428571428571429 StePanel requests returned 5xx responses in fifteen minutes while request volume was below the ratio-alert threshold. Inspect request logs and group failures by route and status.
      - eval_time: 25m
        alertname: StePanelHTTP5xxRateHigh
        exp_alerts: []

  # No traffic at all: neither rule fires (no division-by-zero alert).
  - interval: 1m
    input_series:
      - series: 'stepanel_http_requests_total{job="stepanel"}'
        values: '0x30'
      - series: 'stepanel_http_errors_total{job="stepanel"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: StePanelHTTP5xxRateHigh
        exp_alerts: []
      - eval_time: 25m
        alertname: StePanelHTTP5xxLowTraffic
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'stepanel_backup_last_success_age_seconds{job="stepanel",site="late"}'
        values: '90000+60x30'
      - series: 'stepanel_backup_interval_seconds{job="stepanel",site="late"}'
        values: '86400+0x30'
      - series: 'stepanel_backup_last_success_age_seconds{job="stepanel",site="ontime"}'
        values: '3600+60x30'
      - series: 'stepanel_backup_interval_seconds{job="stepanel",site="ontime"}'
        values: '86400+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: StePanelBackupOverdue
        exp_alerts:
          - exp_labels:
              job: stepanel
              site: late
              severity: critical
            exp_annotations:
              summary: Scheduled backup for late is overdue
              description: The last successful backup for late is 1h 20m 0s beyond its configured interval plus one-hour grace period. Inspect its last success/attempt timestamps and latest backup job error; verify free bytes/inodes and offsite transfer status before retrying.

  - interval: 1m
    input_series:
      - series: 'stepanel_backup_consecutive_failures_by_site{job="stepanel",site="failing"}'
        values: '2+0x30'
      - series: 'stepanel_backup_consecutive_failures_by_site{job="stepanel",site="healthy"}'
        values: '0+0x30'
      - series: 'stepanel_backup_success_present{job="stepanel",site="never"}'
        values: '0+0x30'
      - series: 'stepanel_backup_success_present{job="stepanel",site="good"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: StePanelScheduledBackupFailures
        exp_alerts:
          - exp_labels:
              job: stepanel
              site: failing
              severity: critical
            exp_annotations:
              summary: Scheduled backups are failing for failing
              description: failing has 2 consecutive scheduled backup failure(s). Inspect its latest backup job, free bytes and inodes, database helper, and offsite destination before retrying.
      - eval_time: 20m
        alertname: StePanelBackupNeverSucceeded
        exp_alerts:
          - exp_labels:
              job: stepanel
              site: never
              severity: critical
            exp_annotations:
              summary: No successful scheduled backup exists for never
              description: The enabled schedule for never has no recorded successful backup (success-present metric is 0). Check its latest attempt age and job result; create a verified backup and rehearse a restore.
