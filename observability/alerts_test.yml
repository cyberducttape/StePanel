# promtool unit tests for alerts.yml:
#   promtool test rules observability/alerts_test.yml
rule_files:
  - alerts.yml

evaluation_interval: 30s

tests:
  - interval: 1m
    input_series:
      - series: 'stepanel_site_runtime_inventory_up{job="stepanel"}'
        values: '0+0x30'
      - series: 'stepanel_site_runtime_inventory_sample_timestamp_seconds{job="stepanel"}'
        values: '0+0x30'
      - series: 'stepanel_site_fpm_configured{job="stepanel",site="shop"}'
        values: '1+0x30'
      - series: 'stepanel_site_fpm_probe_up{job="stepanel",site="shop"}'
        values: '0+0x30'
      - series: 'stepanel_site_resource_probe_up{job="stepanel",site="resource"}'
        values: '0+0x30'
      - series: 'stepanel_site_resource_configured{job="stepanel",site="resource"}'
        values: '1+0x30'
      - series: 'stepanel_certificate_renewal_inventory_up{job="stepanel"}'
        values: '1+0x30'
      - series: 'stepanel_certificate_renewal_latest_job_timestamp_seconds{job="stepanel",domain="example.test",state="failed"}'
        values: '1793385600+0x30'
      - series: 'stepanel_database_diagnostics_up{job="stepanel",engine="mariadb",reason="authentication"}'
        values: '0+0x30'
      - series: 'stepanel_database_diagnostics_sample_timestamp_seconds{job="stepanel",engine="mariadb"}'
        values: '1793385600+0x30'
      - series: 'stepanel_site_fpm_listen_queue{job="stepanel",site="busy",php_version="8.3"}'
        values: '3+0x30'
      - series: 'stepanel_site_fpm_active_workers{job="stepanel",site="busy",php_version="8.3"}'
        values: '8+0x30'
      - series: 'stepanel_site_fpm_max_children{job="stepanel",site="busy",php_version="8.3"}'
        values: '8+0x30'
      - series: 'stepanel_site_resource_memory_current_bytes{job="stepanel",site="memory"}'
        values: '950+0x30'
      - series: 'stepanel_site_resource_memory_max_bytes{job="stepanel",site="memory"}'
        values: '1000+0x30'
      - series: 'stepanel_site_resource_tasks_current{job="stepanel",site="tasks"}'
        values: '19+0x30'
      - series: 'stepanel_site_resource_tasks_max{job="stepanel",site="tasks"}'
        values: '20+0x30'
      - series: 'stepanel_site_resource_memory_current_bytes{job="stepanel",site="memory-full"}'
        values: '1000+0x30'
      - series: 'stepanel_site_resource_memory_max_bytes{job="stepanel",site="memory-full"}'
        values: '1000+0x30'
      - series: 'stepanel_site_resource_tasks_current{job="stepanel",site="tasks-full"}'
        values: '20+0x30'
      - series: 'stepanel_site_resource_tasks_max{job="stepanel",site="tasks-full"}'
        values: '20+0x30'
      - series: 'stepanel_site_resource_cpu_quota_utilization_percent{job="stepanel",site="cpu-near"}'
        values: '96.5+0x30'
      - series: 'stepanel_site_resource_cpu_quota_utilization_percent{job="stepanel",site="cpu-full"}'
        values: '100+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: StePanelDatabaseDiagnosticsDown
        exp_alerts:
          - exp_labels:
              job: stepanel
              engine: mariadb
              reason: authentication
              severity: warning
            exp_annotations:
              summary: Database diagnostics are unavailable
              description: "StePanel could not complete its restricted mariadb connectivity/diagnostics query: reason=authentication, availability=0 (0 means the probe failed). The evidence time is stepanel_database_diagnostics_sample_timestamp_seconds for engine=mariadb. For connection_refused, inspect the DB service/listener; for authentication, verify the restricted helper credentials/grants; for socket_unavailable or helper_unavailable, inspect the configured socket/client. Confirm with a fresh connection check before changing credentials. Raw command output is intentionally withheld."
      - eval_time: 20m
        alertname: StePanelCertificateRenewalFailed
        exp_alerts:
          - exp_labels:
              job: stepanel
              domain: example.test
              state: failed
              severity: critical
            exp_annotations:
              summary: Certificate issuance failed for example.test
              description: "The latest durable certificate issuance job for example.test is failed (job timestamp 1793385600). This is durable job evidence, not merely a service-state check. Open the domain's job to read its recorded failure, then check DNS/HTTP challenge reachability, certificate lineage/expiry, and web-server reload evidence before retrying."
      - eval_time: 20m
        alertname: StePanelSiteRuntimeInventoryUnavailable
        exp_alerts:
          - exp_labels:
              job: stepanel
              severity: warning
            exp_annotations:
              summary: Per-site runtime monitoring inventory is incomplete
              description: The site runtime inventory completeness metric is 0 (0 means one or more inventory sources failed or the site cap was reached). Check account/resource state reads and the sampler log; some sites may not have PHP-FPM or cgroup alerts.
      - eval_time: 20m
        alertname: StePanelSiteRuntimeSamplesStale
        exp_alerts:
          - exp_labels:
              job: stepanel
              severity: warning
            exp_annotations:
              summary: Per-site runtime metrics have not refreshed
              description: The site runtime inventory sample is 20m 0s old, above the five-minute threshold. Check the panel runtime sampler, root broker, and account/resource inventories before trusting per-site alert coverage.
      - eval_time: 20m
        alertname: StePanelSiteFPMProbeUnavailable
        exp_alerts:
          - exp_labels:
              job: stepanel
              site: shop
              severity: warning
            exp_annotations:
              summary: PHP-FPM status is unavailable for shop
              description: The managed PHP-FPM pool probe for shop reports 0 (0 means the broker could not obtain pool counters). Check the sample timestamp, pool socket ownership/status endpoint, and root-broker logs; do not infer that the site is healthy from systemd service state alone.
      - eval_time: 20m
        alertname: StePanelSiteFPMSaturated
        exp_alerts:
          - exp_labels:
              job: stepanel
              site: busy
              php_version: "8.3"
              severity: critical
            exp_annotations:
              summary: PHP-FPM is queuing requests for busy (PHP 8.3)
              description: "3 PHP requests are queued for busy (PHP 8.3) while active workers equal the pool's max_children limit; this persisted for two minutes. Evidence is stepanel_site_fpm_listen_queue, stepanel_site_fpm_active_workers, stepanel_site_fpm_max_children, and the site's runtime sample timestamp. Inspect PHP-FPM slow-request evidence and host memory headroom, then validate a proposed worker change before applying it."
      - eval_time: 20m
        alertname: StePanelSiteResourceProbeUnavailable
        exp_alerts:
          - exp_labels:
              job: stepanel
              site: resource
              severity: warning
            exp_annotations:
              summary: Resource-limit usage is unavailable for resource
              description: The site's systemd resource probe reports 0 (0 means cgroup status could not be measured). Check the sample timestamp, root-broker/resource helper, and managed slice state; do not infer that site limits are enforced from the desired profile alone.
      - eval_time: 20m
        alertname: StePanelSiteCgroupMemoryNearLimit
        exp_alerts:
          - exp_labels:
              job: stepanel
              site: memory
              severity: warning
            exp_annotations:
              summary: Site memory is near its enforced cgroup memory limit
              description: Observed cgroup memory use is 95% of the site's configured memory.max for five minutes. Check current/max byte metrics and the sample timestamp; review workload and host headroom before an operator-approved limit change.
      - eval_time: 20m
        alertname: StePanelSiteCgroupMemoryLimitReached
        exp_alerts:
          - exp_labels:
              job: stepanel
              site: memory-full
              severity: critical
            exp_annotations:
              summary: Site memory-full has reached its cgroup memory limit
              description: Observed cgroup memory use is 100% of memory.max. Check the current/max byte metrics and recent OOM evidence; reduce workload or free host capacity before an operator-approved limit change.
      - eval_time: 20m
        alertname: StePanelSiteCgroupTasksNearLimit
        exp_alerts:
          - exp_labels:
              job: stepanel
              site: tasks
              severity: warning
            exp_annotations:
              summary: Site tasks is near its enforced task limit
              description: Observed cgroup task use is 95% of the site's configured TasksMax for five minutes. Check current/max task metrics and the sample timestamp; inspect process growth and scheduled jobs before changing the limit.
      - eval_time: 20m
        alertname: StePanelSiteCgroupTasksLimitReached
        exp_alerts:
          - exp_labels:
              job: stepanel
              site: tasks-full
              severity: critical
            exp_annotations:
              summary: Site tasks-full has reached its task limit
              description: Observed cgroup task use is 100% of TasksMax. Check current/max task metrics and recent task creation errors; investigate runaway processes before changing the limit.
      - eval_time: 20m
        alertname: StePanelSiteCPUQuotaNearLimit
        exp_alerts:
          - exp_labels:
              job: stepanel
              site: cpu-near
              severity: warning
            exp_annotations:
              summary: Site cpu-near is using most of its CPU quota
              description: The site's measured CPU time used 96.5% of its configured CPU quota over the latest sampling interval, above 90% for five minutes. Compare the CPU utilization and resource sample timestamp metrics; inspect slow PHP requests and job activity before an operator-approved quota change.
      - eval_time: 20m
        alertname: StePanelSiteCPUQuotaSaturated
        exp_alerts:
          - exp_labels:
              job: stepanel
              site: cpu-full
              severity: critical
            exp_annotations:
              summary: Site cpu-full reached its CPU quota
              description: The site's measured CPU time used 100.0% of its configured CPU quota over the latest sampling interval, at or above the enforced limit for two minutes. Check the resource sample timestamp, PHP-FPM slow requests, and active jobs; reduce workload or review capacity before an operator-approved quota change.

  - interval: 1m
    input_series:
      - series: 'stepanel_host_filesystem_probe_up{job="stepanel",role="control_plane"}'
        values: '0+0x30'
      - series: 'stepanel_host_filesystem_available_bytes{job="stepanel",role="sites"}'
        values: '500+0x30'
      - series: 'stepanel_host_filesystem_total_bytes{job="stepanel",role="sites"}'
        values: '10000+0x30'
      - series: 'stepanel_host_filesystem_available_inodes{job="stepanel",role="backups"}'
        values: '80+0x30'
      - series: 'stepanel_host_filesystem_total_inodes{job="stepanel",role="backups"}'
        values: '1000+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: StePanelFilesystemCapacityUnavailable
        exp_alerts:
          - exp_labels:
              job: stepanel
              role: control_plane
              severity: warning
            exp_annotations:
              summary: Filesystem capacity could not be measured for control_plane
              description: The control_plane filesystem probe reports 0 (0 means Statfs failed) for five minutes. Check the configured storage path and panel permissions; do not assume the filesystem has free capacity until a fresh measurement succeeds.
      - eval_time: 20m
        alertname: StePanelFilesystemBytesLow
        exp_alerts:
          - exp_labels:
              job: stepanel
              role: sites
              severity: critical
            exp_annotations:
              summary: Free disk space is below 10% for sites storage
              description: "Only 5% of bytes remain on the sites filesystem, below the 10% threshold for ten minutes. Evidence is stepanel_host_filesystem_available_bytes divided by stepanel_host_filesystem_total_bytes for this role. Identify large consumers and use the storage runbook to safely free or add capacity before admitting imports or restores."
      - eval_time: 20m
        alertname: StePanelFilesystemInodesLow
        exp_alerts:
          - exp_labels:
              job: stepanel
              role: backups
              severity: critical
            exp_annotations:
              summary: Free inodes are below 10% for backups storage
              description: "Only 8% of inodes remain on the backups filesystem, below the 10% threshold for ten minutes. Evidence is stepanel_host_filesystem_available_inodes divided by stepanel_host_filesystem_total_inodes for this role. Find directories with excessive file counts and use the storage runbook to safely free or add capacity before making changes."

  - interval: 1m
    input_series:
      - series: 'stepanel_control_plane_database_limit_ratio{job="stepanel"}'
        values: '0.90+0x30'
      - series: 'stepanel_capacity_reservations_up{job="stepanel"}'
        values: '0+0x30'
      - series: 'stepanel_audit_outbox_pending{job="stepanel"}'
        values: '1+0x30'
      - series: 'stepanel_audit_outbox_oldest_pending_age_seconds{job="stepanel"}'
        values: '400+0x30'
      - series: 'stepanel_operator_notifications_pending{job="stepanel"}'
        values: '1+0x30'
      - series: 'stepanel_operator_notifications_oldest_pending_age_seconds{job="stepanel"}'
        values: '1000+0x30'
      - series: 'stepanel_jobs_inventory_errors{job="stepanel"}'
        values: '1+0x30'
      - series: 'stepanel_jobs_dead_letter{job="stepanel"}'
        values: '1+0x30'
      - series: 'stepanel_jobs_queued{job="stepanel"}'
        values: '1+0x30'
      - series: 'stepanel_jobs_oldest_queued_age_seconds{job="stepanel"}'
        values: '1000+0x30'
      - series: 'stepanel_readiness_check_ready{job="stepanel",check="root_broker"}'
        values: '0+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: StePanelControlPlaneDatabaseNearLimit
        exp_alerts:
          - exp_labels:
              job: stepanel
              severity: warning
            exp_annotations:
              summary: StePanel control-plane database is nearing its configured limit
              description: SQLite logical page allocation is 90% of the configured 10 GiB limit, above the 80% threshold. Review database growth, retained jobs/outboxes, and maintenance capacity before writes are refused.
      - eval_time: 20m
        alertname: StePanelCapacityLedgerUnavailable
        exp_alerts:
          - exp_labels:
              job: stepanel
              severity: critical
            exp_annotations:
              summary: Durable storage admission telemetry is unavailable
              description: The capacity reservation ledger health metric is 0 (0 means unavailable). Verify control-plane SQLite health and confirm storage-consuming operations are refusing admission when reservations cannot be checked.
      - eval_time: 20m
        alertname: StePanelAuditOutboxBacklog
        exp_alerts:
          - exp_labels:
              job: stepanel
              severity: critical
            exp_annotations:
              summary: Durable audit events are not reaching the signed audit log
              description: The oldest unpublished audit event is 6m 40s old, above five minutes. Check signed audit-log permissions, disk/inode capacity, and publication errors in the audit outbox.
      - eval_time: 20m
        alertname: StePanelNotificationOutboxBacklog
        exp_alerts:
          - exp_labels:
              job: stepanel
              severity: warning
            exp_annotations:
              summary: Operator notifications are accumulating
              description: A required operator notification has remained pending for 16m 40s, above fifteen minutes. Check the affected channel's destination, retry/error state, and notification outbox.
      - eval_time: 20m
        alertname: StePanelJobInventoryUnavailable
        exp_alerts:
          - exp_labels:
              job: stepanel
              severity: warning
            exp_annotations:
              summary: StePanel could not read durable job inventory
              description: The durable job inventory reports 1 read error(s); job status metrics may be incomplete. Check control-plane SQLite health and panel/worker database connectivity before trusting queue views.
      - eval_time: 20m
        alertname: StePanelDeadLetterJobs
        exp_alerts:
          - exp_labels:
              job: stepanel
              severity: critical
            exp_annotations:
              summary: StePanel has jobs requiring operator review
              description: 1 durable job(s) exhausted retries and require operator review. Inspect each job's error, affected resource, and recovery state before explicitly retrying, resolving, or archiving it.
      - eval_time: 20m
        alertname: StePanelQueueWaitTooLong
        exp_alerts:
          - exp_labels:
              job: stepanel
              severity: warning
            exp_annotations:
              summary: StePanel jobs are waiting unusually long
              description: The oldest durable queued job has waited 16m 40s, above the fifteen-minute threshold, while the alert condition confirms at least one queued job exists. Check worker availability, admission limits, and earlier work blocking the same owner.
      - eval_time: 20m
        alertname: StePanelReadinessCheckFailed
        exp_alerts:
          - exp_labels:
              job: stepanel
              check: root_broker
              severity: critical
            exp_annotations:
              summary: A StePanel readiness check is failing
              description: Readiness component root_broker reports 0 (0 means failed) for five minutes. Inspect /readyz for the component's detailed evidence and address that dependency before making changes.

  # 100 requests per minute with 10 percent failing: the ratio rule fires.
  - interval: 1m
    input_series:
      - series: 'stepanel_http_requests_total{job="stepanel"}'
        values: '0+100x30'
      - series: 'stepanel_http_errors_total{job="stepanel"}'
        values: '0+10x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: StePanelHTTP5xxRateHigh
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: StePanel HTTP error rate is elevated
              description: The observed StePanel 5xx request ratio is 10%, above the 5% threshold for ten minutes. Check recent request logs, readiness, and the failing route distribution.
      - eval_time: 20m
        alertname: StePanelHTTP5xxLowTraffic
        exp_alerts: []

  # Healthy high traffic (1 percent failing) does not fire.
  - interval: 1m
    input_series:
      - series: 'stepanel_http_requests_total{job="stepanel"}'
        values: '0+100x30'
      - series: 'stepanel_http_errors_total{job="stepanel"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: StePanelHTTP5xxRateHigh
        exp_alerts: []

  # The reviewer's case: about 10 requests per five minutes with one in five
  # failing. The old clamped ratio computed ~0.67% and never fired; this is a
  # 20% failure rate and the low-traffic rule fires.
  - interval: 1m
    input_series:
      - series: 'stepanel_http_requests_total{job="stepanel"}'
        values: '0+2x30'
      - series: 'stepanel_http_errors_total{job="stepanel"}'
        values: '0 0 0 0 0 2 2 2 2 2 4 4 4 4 4 6 6 6 6 6 8 8 8 8 8 10 10 10 10 10 12'
    alert_rule_test:
      - eval_time: 25m
        alertname: StePanelHTTP5xxLowTraffic
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: StePanel is returning server errors at low traffic
              description: 6.428571428571429 StePanel requests returned 5xx responses in fifteen minutes while request volume was below the ratio-alert threshold. Inspect request logs and group failures by route and status.
      - eval_time: 25m
        alertname: StePanelHTTP5xxRateHigh
        exp_alerts: []

  # No traffic at all: neither rule fires (no division-by-zero alert).
  - interval: 1m
    input_series:
      - series: 'stepanel_http_requests_total{job="stepanel"}'
        values: '0x30'
      - series: 'stepanel_http_errors_total{job="stepanel"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: StePanelHTTP5xxRateHigh
        exp_alerts: []
      - eval_time: 25m
        alertname: StePanelHTTP5xxLowTraffic
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'stepanel_backup_last_success_age_seconds{job="stepanel",site="late"}'
        values: '90000+60x30'
      - series: 'stepanel_backup_interval_seconds{job="stepanel",site="late"}'
        values: '86400+0x30'
      - series: 'stepanel_backup_last_success_age_seconds{job="stepanel",site="ontime"}'
        values: '3600+60x30'
      - series: 'stepanel_backup_interval_seconds{job="stepanel",site="ontime"}'
        values: '86400+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: StePanelBackupOverdue
        exp_alerts:
          - exp_labels:
              job: stepanel
              site: late
              severity: critical
            exp_annotations:
              summary: Scheduled backup for late is overdue
              description: "The last successful scheduled backup for late is 1h 20m 0s past its configured interval plus the one-hour grace period. Evidence is stepanel_backup_last_success_age_seconds and stepanel_backup_interval_seconds; also inspect stepanel_backup_last_attempt_age_seconds and the latest durable backup job error. Check free bytes/inodes and offsite transfer/verification status before retrying."

  - interval: 1m
    input_series:
      - series: 'stepanel_backup_consecutive_failures_by_site{job="stepanel",site="failing"}'
        values: '2+0x30'
      - series: 'stepanel_backup_consecutive_failures_by_site{job="stepanel",site="healthy"}'
        values: '0+0x30'
      - series: 'stepanel_backup_success_present{job="stepanel",site="never"}'
        values: '0+0x30'
      - series: 'stepanel_backup_success_present{job="stepanel",site="good"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: StePanelScheduledBackupFailures
        exp_alerts:
          - exp_labels:
              job: stepanel
              site: failing
              severity: critical
            exp_annotations:
              summary: Scheduled backups are failing for failing
              description: failing has 2 consecutive scheduled backup failure(s). Inspect its latest backup job, free bytes and inodes, database helper, and offsite destination before retrying.
      - eval_time: 20m
        alertname: StePanelBackupNeverSucceeded
        exp_alerts:
          - exp_labels:
              job: stepanel
              site: never
              severity: critical
            exp_annotations:
              summary: No successful scheduled backup exists for never
              description: The enabled schedule for never has no recorded successful backup (success-present metric is 0). Check its latest attempt age and job result; create a verified backup and rehearse a restore.

  - interval: 1m
    input_series:
      - series: 'stepanel_security_audit_outcomes_unresolved{job="stepanel"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: StePanelSecurityAuditOutcomeUnresolved
        exp_alerts:
          - exp_labels:
              job: stepanel
              severity: critical
            exp_annotations:
              summary: A host operation has no durable terminal audit outcome
              description: "1 security operation(s) remain pending in security_audit_operations. Inspect /api/security/audit/reconciliation and compare the recorded operation ID, actor, target, host state, and job history. Record evidence-based reconciliation; do not rerun the mutation solely to obtain an audit event."
