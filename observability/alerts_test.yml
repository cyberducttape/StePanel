# promtool unit tests for alerts.yml:
#   promtool test rules observability/alerts_test.yml
rule_files:
  - alerts.yml

evaluation_interval: 30s

tests:
  - interval: 1m
    input_series:
      - series: 'stepanel_control_plane_database_limit_ratio{job="stepanel"}'
        values: '0.90+0x30'
      - series: 'stepanel_capacity_reservations_up{job="stepanel"}'
        values: '0+0x30'
      - series: 'stepanel_audit_outbox_pending{job="stepanel"}'
        values: '1+0x30'
      - series: 'stepanel_audit_outbox_oldest_pending_age_seconds{job="stepanel"}'
        values: '400+0x30'
      - series: 'stepanel_operator_notifications_pending{job="stepanel"}'
        values: '1+0x30'
      - series: 'stepanel_operator_notifications_oldest_pending_age_seconds{job="stepanel"}'
        values: '1000+0x30'
      - series: 'stepanel_jobs_inventory_errors{job="stepanel"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: StePanelControlPlaneDatabaseNearLimit
        exp_alerts:
          - exp_labels:
              job: stepanel
              severity: warning
            exp_annotations:
              summary: StePanel control-plane database is nearing its configured limit
              description: SQLite logical page allocation is above 80 percent of the fixed 10 GiB limit; inspect job and outbox retention and plan maintenance before writes are refused.
      - eval_time: 20m
        alertname: StePanelCapacityLedgerUnavailable
        exp_alerts:
          - exp_labels:
              job: stepanel
              severity: critical
            exp_annotations:
              summary: Durable storage admission telemetry is unavailable
              description: The capacity reservation ledger could not be read; verify control-plane SQLite health and that storage-consuming operations are failing closed.
      - eval_time: 20m
        alertname: StePanelAuditOutboxBacklog
        exp_alerts:
          - exp_labels:
              job: stepanel
              severity: critical
            exp_annotations:
              summary: Durable audit events are not reaching the signed audit log
              description: The oldest unpublished audit event is more than five minutes old; inspect audit-log permissions, disk capacity, and the audit outbox.
      - eval_time: 20m
        alertname: StePanelNotificationOutboxBacklog
        exp_alerts:
          - exp_labels:
              job: stepanel
              severity: warning
            exp_annotations:
              summary: Operator notifications are accumulating
              description: At least one required alert delivery has remained pending for more than fifteen minutes; inspect destination health and notification outbox metrics.
      - eval_time: 20m
        alertname: StePanelJobInventoryUnavailable
        exp_alerts:
          - exp_labels:
              job: stepanel
              severity: warning
            exp_annotations:
              summary: StePanel could not read durable job inventory
              description: Job queue metrics are unavailable; inspect control-plane SQLite health and the panel-worker database connection before trusting job status views.

  # 100 requests per minute with 10 percent failing: the ratio rule fires.
  - interval: 1m
    input_series:
      - series: 'stepanel_http_requests_total{job="stepanel"}'
        values: '0+100x30'
      - series: 'stepanel_http_errors_total{job="stepanel"}'
        values: '0+10x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: StePanelHTTP5xxRateHigh
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: StePanel HTTP error rate is elevated
              description: More than five percent of StePanel requests returned 5xx responses for ten minutes.
      - eval_time: 20m
        alertname: StePanelHTTP5xxLowTraffic
        exp_alerts: []

  # Healthy high traffic (1 percent failing) does not fire.
  - interval: 1m
    input_series:
      - series: 'stepanel_http_requests_total{job="stepanel"}'
        values: '0+100x30'
      - series: 'stepanel_http_errors_total{job="stepanel"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: StePanelHTTP5xxRateHigh
        exp_alerts: []

  # The reviewer's case: about 10 requests per five minutes with one in five
  # failing. The old clamped ratio computed ~0.67% and never fired; this is a
  # 20% failure rate and the low-traffic rule fires.
  - interval: 1m
    input_series:
      - series: 'stepanel_http_requests_total{job="stepanel"}'
        values: '0+2x30'
      - series: 'stepanel_http_errors_total{job="stepanel"}'
        values: '0 0 0 0 0 2 2 2 2 2 4 4 4 4 4 6 6 6 6 6 8 8 8 8 8 10 10 10 10 10 12'
    alert_rule_test:
      - eval_time: 25m
        alertname: StePanelHTTP5xxLowTraffic
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: StePanel is returning server errors at low traffic
              description: At least three StePanel requests returned 5xx responses in fifteen minutes while traffic was too low for the error-rate alert.
      - eval_time: 25m
        alertname: StePanelHTTP5xxRateHigh
        exp_alerts: []

  # No traffic at all: neither rule fires (no division-by-zero alert).
  - interval: 1m
    input_series:
      - series: 'stepanel_http_requests_total{job="stepanel"}'
        values: '0x30'
      - series: 'stepanel_http_errors_total{job="stepanel"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: StePanelHTTP5xxRateHigh
        exp_alerts: []
      - eval_time: 25m
        alertname: StePanelHTTP5xxLowTraffic
        exp_alerts: []
