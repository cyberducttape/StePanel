# Staticcheck runs in CI with every correctness (SA) and simplification (S)
# check enabled. These style checks are disabled until the existing code is
# migrated, so new findings in the enabled classes stay visible:
#   ST1005  error strings that start with a capital or end with punctuation
#   ST1013  numeric HTTP status codes instead of net/http constants
#   U1000   unused code (tracked as a separate dead-code cleanup)
checks = ["inherit", "-ST1005", "-ST1013", "-U1000"]
